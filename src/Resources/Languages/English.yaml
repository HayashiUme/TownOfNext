Achievement.101402.Description: "Complete 2 kills with the snipe ray in one round and win with the Impostors."
Achievement.101501.Name: "Opening Strings"
Achievement.101501.Description: "Successfully mark a player and have the automatic puppet kill actually take down a valid target."
Achievement.101502.Name: "Invisible Manipulation"
Achievement.101502.Description: "Have the automatic puppet kill take down 2 different targets in one round and win with the Impostors; your own direct kills do not count."
Achievement.101601.Name: "Blackout Hunt"
Achievement.101601.Description: "Complete a kill during a blackout."
