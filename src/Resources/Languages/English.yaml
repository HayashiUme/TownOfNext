Achievement.100101.Name: "Bounty Strike"
Achievement.100101.Description: "Personally kill the current bounty target within the bounty time limit."
Achievement.100102.Name: "Chain Manhunt"
Achievement.100102.Description: "Complete 3 bounty kills in one round and win with the Impostors."
Achievement.100201.Name: "Blood Debt Still Warm"
Achievement.100201.Description: "Complete a kill before the suicide countdown expires."
Achievement.100202.Name: "Bloodthirsty Endless Night"
Achievement.100202.Description: "Complete 3 kills in one round, avoid the countdown suicide, and win with the Impostors."
Achievement.100301.Name: "Delayed Death"
Achievement.100301.Description: "Land a successful bite and have that bite cause the target to die later."
Achievement.100302.Name: "Blood Moon Feast"
Achievement.100302.Description: "Have at least 2 bites cause delayed deaths in one round and win with the Impostors."
Achievement.100401.Name: "Curse Takes Effect"
Achievement.100401.Description: "Successfully curse a player and have a Warlock-triggered curse kill cause another player's death. The cursed player's own ordinary kills do not count."
Achievement.100402.Name: "Kill by Proxy"
Achievement.100402.Description: "Have 2 curse kills actually take effect in one round and win with the Impostors."
Achievement.100501.Name: "Mark and Execute"
Achievement.100501.Description: "Successfully mark a target and kill that target through your shapeshift teleport."
Achievement.100502.Name: "Silent Arrival"
Achievement.100502.Description: "Kill 2 different targets with the Assassin's teleport strike in one round and survive to an Impostor win."
Achievement.100601.Name: "Slow Advance"
Achievement.100601.Description: "Kill a player after the Zombie mechanic has actually reduced your movement speed."
Achievement.100602.Name: "Undying Destination"
Achievement.100602.Description: "Lose at least 0.3 base speed cumulatively to the Zombie mechanic, then complete a kill and win with the Impostors."
Achievement.100701.Name: "Forced Report"
Achievement.100701.Description: "Successfully hack a player and make them report the body of your kill this round."
Achievement.100702.Name: "Report Without a Body"
Achievement.100702.Description: "With no reportable body on the field, hack to actually start a special meeting and win with the Impostors."
Achievement.100801.Name: "Old Pipe, New Exit"
Achievement.100801.Description: "Through shapeshift or revert, successfully teleport to the last vent you used."
Achievement.100802.Name: "Vent Shuttle"
Achievement.100802.Description: "Trigger 3 Miner teleports in one round and land a kill within 10 seconds of one of them."
Achievement.100901.Name: "Exit from Origin"
Achievement.100901.Description: "After marking a spot, reach 8 world units from it, then teleport back to the marked spot."
Achievement.100902.Name: "Nowhere Trail"
Achievement.100902.Description: "Kill a player within 10 seconds of teleporting back to your marked spot, then win with the Impostors."
Achievement.101001.Name: "Only Knows Killing"
Achievement.101001.Description: "As the Killing Machine, complete one valid kill."
Achievement.101002.Name: "Killing Instinct"
Achievement.101002.Description: "Get 3 kills in one round and win with the Impostors."
Achievement.101101.Name: "After-Meeting Effect"
Achievement.101101.Description: "Have a cursed target die from the curse after the meeting ends."
Achievement.101102.Name: "Unfinished Judgment"
Achievement.101102.Description: "Have 2 curses each cause an after-meeting death in one round and win with the Impostors."
Achievement.101201.Name: "Business After Death"
Achievement.101201.Description: "After you die, successfully kill a player with your revenge command."
Achievement.101202.Name: "Endgame from Behind"
Achievement.101202.Description: "While dead, kill a crewmate with your Mafia skill and have the next win check triggered by that death produce an Impostor base win, then win with the Impostors."
Achievement.101301.Name: "Fireworks Test"
Achievement.101301.Description: "Successfully place and detonate at least one firework bomb, and have the blast kill a player."
