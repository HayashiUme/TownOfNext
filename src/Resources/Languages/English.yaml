Achievement.301501.Description: "Successfully kill a player and have the Stalker skill turn a power sabotage from inactive to active."
Achievement.301502.Name: "Seize Power in the Dark"
Achievement.301502.Description: "Actually trigger at least 3 different power-sabotage instances through kills in one round and win by your Stalker snatch-victory rule."
Achievement.301601.Name: "Extra Tasks"
Achievement.301601.Description: "Complete half of your total Workaholic-assigned tasks, rounded up."
Achievement.301602.Name: "Never Clock Out"
Achievement.301602.Description: "Complete all of the Workaholic's required tasks, actually trigger your Workaholic win source and be a final winner. Whether death can win follows the host option."
Achievement.301701.Name: "Collecting Votes"
Achievement.301701.Description: "Vote for a player and actually increase your collected vote count."
Achievement.301702.Name: "Ballot Full"
Achievement.301702.Description: "Reach the vote-collection win threshold before the exile resolves and win through your own Collector win source."
Achievement.301801.Name: "Shared Fate"
Achievement.301801.Description: "Use the Provocateur skill and die together with a target."
Achievement.301802.Name: "Same Death, Different Fates"
Achievement.301802.Description: "Have your self-destruct target not in the final winner list while you win through your own Provocateur additional-win rule."
Achievement.301901.Name: "Shield After Kill"
Achievement.301901.Description: "After a valid kill, successfully gain the Blood Knight's role shield."
Achievement.301902.Name: "Shield Combo"
Achievement.301902.Description: "Have the Blood Knight shield actually absorb 2 different ordinary kill attempts in one round and win with the Blood Knight side."
Achievement.302002.Name: "Posthumous Dividend"
Achievement.302002.Description: "While dead, win through your Follower additional-win rule because your bet target won. Neutral shared wins do not count."
Achievement.302101.Name: "Charm Success"
Achievement.302101.Description: "Successfully charm an eligible non-neutral player and actually turn them to the Succubus side."
Achievement.302102.Name: "Charm Majority"
Achievement.302102.Description: "Successfully charm at least 2 different players, trigger the Succubus headcount base win, and finish as a winner."
Achievement.302201.Name: "Choosing a Side"
Achievement.302201.Description: "Take a valid attack as the cat, have the cat mechanic prevent that death and actually convert your role."
Achievement.302202.Name: "The Other Side of the Cat"
Achievement.302202.Description: "After converting through the cat's hit reaction, enter the final winner list with the role or faction gained from that conversion."
Achievement.302301.Name: "Infection Spreads"
Achievement.302301.Description: "Make a valid target actually reach the Plague Doctor's infection-complete state."
Achievement.302302.Name: "Plague Endgame"
Achievement.302302.Description: "Infect every eligible living player and win through your own Plague Doctor win source."
Achievement.302401.Name: "Swap Identities"
Achievement.302401.Description: "As the Shifter, choose a target and actually complete the role swap in the following meeting-end processing phase."
Achievement.302402.Name: "Fate Shuffle"
Achievement.302402.Description: "Complete a swap as the Shifter, be swapped back into the Shifter by another Shifter, then complete a second swap gaining a different main role each time, and survive to settlement."
Achievement.302501.Name: "Correct Guess"
Achievement.302501.Description: "Have one valid guess actually recorded as correct for the Doomsayer."
Achievement.302502.Name: "Undefeated Guess Streak"
Achievement.302502.Description: "Complete the correct guesses required to win under the host settings with no wrong guesses and win through your own Doomsayer win source."
Achievement.302601.Name: "Rival Appears"
Achievement.302601.Description: "Have a player actually marked as your rival for staying near your crush long enough."
Achievement.302602.Name: "Only You and Me Left"
Achievement.302602.Description: "Meet the Yandere endgame headcount and crush conditions, trigger your Yandere win source and be a final winner."
Achievement.302701.Name: "Cheerful Exit"
Achievement.302701.Description: "After you die, enter the final winner list through the Sunnyboy additional-win rule. Neutral shared wins do not count."
Achievement.302702.Name: "The Show Goes On"
Achievement.302702.Description: "Die before the first meeting of the round starts, then see through at least 2 actual meetings and still win through your own Sunnyboy additional-win rule."
Achievement.302801.Name: "Proxy After Death"
Achievement.302801.Description: "Have a valid client assigned, die as the Lawyer without changing roles, and at settlement win through the Lawyer rule with both you and the client in the winner list."
Achievement.302802.Name: "Client Takes Priority"
Achievement.302802.Description: "Survive to settlement as the Lawyer with your client having already earned winner status before your Lawyer additional-win check, then have your Lawyer rule remove the client's winner status and add you."
Achievement.302901.Name: "Blanks Useful"
Achievement.302901.Description: "Have a blank-round state you spent a use to issue actually make the corresponding player's next non-suicide kill fail."
Achievement.302902.Name: "Two Rejections"
Achievement.302902.Description: "Have blanks you issued actually block two different players' non-suicide kills once each in one round, survive as the Prosecutor, and win through your own Prosecutor additional-win rule."
Achievement.600101.Name: "Side by Side to the End"
Achievement.600101.Description: "Both lovers survive to settlement and win together."
Achievement.600102.Name: "Together in Life and Death"
Achievement.600102.Description: "After one lover actually dies, have the other die of grief under the enabled room rule."
Achievement.600201.Name: "The Last Impostor"
Achievement.600201.Description: "Become the last living member of the Impostor side and actually gain the Last Impostor cooldown buff."
Achievement.600202.Name: "Desperate Counterkill"
Achievement.600202.Description: "Complete a kill while the desperate buff is active and finish with an Impostor-side win."
Achievement.600301.Name: "Everyone's Lover"
Achievement.600301.Description: "Have the host, through the Neptune display rule, provide at least 3 different players a relationship mark related to you."
Achievement.600302.Name: "Through a Field of Flowers"
Achievement.600302.Description: "Survive through at least 2 actual meetings as a Neptune add-on and finish with your valid side."
Achievement.600401.Name: "See Every Vote"
Achievement.600401.Description: "In an actual meeting vote resolution, have the host apply the Watcher's non-anonymous vote display rule to you."
Achievement.600402.Name: "Secret of the Majority"
Achievement.600402.Description: "After a non-anonymous vote result has been provided to you, vote for an Impostor at the next actual meeting, get them exiled, and win with your valid side."
Achievement.600501.Name: "Blackout Unfazed"
Achievement.600501.Description: "Complete a valid task while a power sabotage is active and the Lighter vision rule is enabled."
Achievement.600502.Name: "Light Up the Win"
Achievement.600502.Description: "Complete at least 3 valid tasks in one round while a power sabotage is active and the Lighter vision rule is enabled, and survive to a Crewmate win."
Achievement.600601.Name: "Death Flash"
Achievement.600601.Description: "When another player dies, have the host successfully send you a kill flash notice through the Seer ability."
Achievement.600602.Name: "Flash Points to the Killer"
Achievement.600602.Description: "After receiving a Seer kill flash, vote for the real killer of that death event at the next meeting, get them exiled, and win with your valid side."
Achievement.600701.Name: "One Step Ahead"
Achievement.600701.Description: "Complete a valid task while the Flash speed buff is active."
Achievement.600702.Name: "Fast as Lightning"
Achievement.600702.Description: "Complete 5 valid tasks in one round while the Flash speed buff is active, and survive to a win with your side."
Achievement.600801.Name: "Break the Tie"
Achievement.600801.Description: "When a vote is tied, have your tie-break effect actually get your vote target exiled."
Achievement.600802.Name: "The Last Vote"
Achievement.600802.Description: "Have your tie-break effect actually exile an Impostor and finish with a win on your side."
Achievement.600901.Name: "Cannot Report"
Achievement.600901.Description: "While the Oblivious restriction is active, enter the valid report range of a real dead player's body."
Achievement.600902.Name: "Silent Witness"
Achievement.600902.Description: "While the Oblivious restriction is active in one round, enter the valid report range of 3 different dead players' bodies and survive to a win with your side."
Achievement.601001.Name: "Vision Contagion"
Achievement.601001.Description: "After you are killed, have the Bewilder effect actually apply vision restriction to the killer."
Achievement.601002.Name: "Deathbed Counter"
Achievement.601002.Description: "After your vision contagion takes effect, have the killer exiled at the next meeting and win with your valid side."
Achievement.601101.Name: "Secret Assistance"
Achievement.601101.Description: "As a Madmate, vote for a real crewmate at a meeting, get them exiled, and win through Impostor-side membership."
Achievement.601102.Name: "First Kill Turnaround"
Achievement.601102.Description: "Actually become a Madmate in first-kill or self-vote turncoat mode and win through Impostor-side membership."
Achievement.601201.Name: "Cannot Repair"
Achievement.601201.Description: "While the Fool restriction is active, complete a valid task during a sabotage you cannot repair."
Achievement.601202.Name: "Each to Their Own Task"
Achievement.601202.Description: "In one round, complete at least one task during each of 2 different sabotage instances you cannot repair due to the Fool restriction, with both sabotages fixed by other players, and finish with your valid side."
Achievement.601301.Name: "First to Hand In"
Achievement.601301.Description: "Under the round's Workhorse granting rule, actually receive that add-on for finishing the required task first."
Achievement.601302.Name: "Extra Work Done Too"
Achievement.601302.Description: "Complete all tasks additionally assigned by your Workhorse grant event and survive to a win with your side."
Achievement.601401.Name: "Take Them With You"
Achievement.601401.Description: "After being killed by an ordinary kill, have your Avenger effect actually kill another player."
Achievement.601402.Name: "Enemies Die Together"
Achievement.601402.Description: "Have your revenge effect take down a player who was on an enemy side at the time, and finish with your valid side winning."
Achievement.601501.Name: "First Blood Protagonist"
Achievement.601501.Description: "Become the first player killed by an ordinary kill in the round, actually trigger your YouTuber win source and finish as a winner."
Achievement.601502.Name: "Not Killing Off the Character This Time"
Achievement.601502.Description: "Not trigger the YouTuber first-kill win, hold the YouTuber add-on, complete the game without physically dying, and win with your valid side."
Achievement.601601.Name: "Monopolize the Win"
Achievement.601601.Description: "Have your Egoist rule actually override an original side's base win and finish as a winner."
Achievement.601602.Name: "Solo Finale"
Achievement.601602.Description: "When you trigger the Egoist snatch, have the winner set before the override contain at least 3 other players, and after all additional and shared-win rules have the final winner list contain only you."
Achievement.601701.Name: "Kills Bank Votes"
Achievement.601701.Description: "After a valid kill, have the Stealer mechanic actually increase your extra votes."
Achievement.601702.Name: "Hidden Vote Decides"
Achievement.601702.Description: "Have your Stealer extra vote actually change the exile result and exile a player on an enemy side at the time."
Achievement.601801.Name: "Counted Twice"
Achievement.601801.Description: "In a valid win check, have your Schizophrenic extra headcount actually counted."
Achievement.601802.Name: "The Extra One"
Achievement.601802.Description: "With the same check snapshot and other rules unchanged, have removing your extra headcount trigger an enemy-side base win while the actual check did not, then win with your valid side."
Achievement.601901.Name: "Intel Left Behind"
Achievement.601901.Description: "After the Mimic dies, have the host send at least one eligible other Impostor the role information of a target you actually killed."
Achievement.601902.Name: "Death List"
Achievement.601902.Description: "Actually kill 2 different players before you die, with their Mimic intel sent to at least one valid teammate, then win with the Impostors."
Achievement.602001.Name: "Ultra-Range Kill"
Achievement.602001.Description: "While the Reach distance buff is active, successfully kill beyond the ordinary kill distance without that buff."
Achievement.602002.Name: "Long-Range Enforcement"
Achievement.602002.Description: "Complete 2 of those ultra-range valid kills in one round and win with your side."
Achievement.602101.Name: "Forced to Report"
Achievement.602101.Description: "After you are killed, have the Bait effect actually make the killer report your body and start a meeting."
Achievement.602102.Name: "Call the Killer Back"
Achievement.602102.Description: "Have the meeting started by your Bait forced report successfully exile the real killer of that death, and finish with your valid side winning."
Achievement.602201.Name: "Trap the Killer"
Achievement.602201.Description: "After you are killed, have the Beartrap effect actually restrict the killer's movement."
Achievement.602202.Name: "Trap Counter"
Achievement.602202.Description: "After your trap effect takes effect, have the killer exiled at the next meeting and finish with your valid side winning."
Achievement.602301.Name: "Color Distortion"
Achievement.602301.Description: "Hold the Colorblind add-on from the official start to settlement and complete the game without physically dying."
Achievement.602302.Name: "Colorless Enemy Spotting"
Achievement.602302.Description: "While the Colorblind effect rule is active, vote for a real Impostor at a meeting, get them exiled, and finish with your valid side winning."
Achievement.500101.Name: "No One Saw Through"
Achievement.500101.Description: "Win with the Impostors with no player exiled by a meeting while validly on the Impostor side."
Achievement.500102.Name: "No Comrades Lost"
Achievement.500102.Description: "When the Impostors win, every valid opening Impostor is still alive and never left the side. Does not count with only one opening Impostor."
Achievement.500103.Name: "Kill Chain"
Achievement.500103.Description: "Between the end of one meeting and the start of the next in one round, have Impostor-source skills actually kill at least 3 different non-Impostor players, then win with the Impostors. Suicides and duplicate bodies do not count."
Achievement.500104.Name: "Sabotage Expert"
Achievement.500104.Description: "Have your base win source be a sabotage timeout that can end the game, with the final win not converted or overridden by Jackal or other roles, and win with the Impostors."
Achievement.500105.Name: "No Bodies Left"
Achievement.500105.Description: "Before the Impostors win, have their skills actually kill at least 3 different non-Impostor players, with those deaths leaving no reportable body under the skill rules. Generating a body then cleaning it does not count as not generating."
Achievement.500106.Name: "Kill With Another's Blade"
Achievement.500106.Description: "Win with the Impostors with at least one explicit manipulation source, such as an Impostor Warlock or Puppeteer, making a non-Impostor cause another non-Impostor's death. An ordinary Sheriff misfire does not count."
Achievement.500107.Name: "One Man's Watch"
Achievement.500107.Description: "After all other opening Impostors die or are exiled, become the only living Impostor, personally complete at least 2 valid kills with no new Impostor joining, and win with the Impostors."
Achievement.500108.Name: "Closing the Net Against the Odds"
Achievement.500108.Description: "After one meeting resolution in the round, be the only living Impostor with at least one other opening Impostor exiled and at least 4 valid living crewmates, then complete at least 3 valid kills and win with the Impostors."
Achievement.500201.Name: "Task Loop Closed"
Achievement.500201.Description: "Have the task-win judgment actually take effect with all valid tasks counted toward the round's crew progress completed, and win with the Crewmates."
Achievement.500202.Name: "No Misjudgment"
Achievement.500202.Description: "Win with the Crewmates, with at least one meeting actually exiling an Impostor and no valid crewmate exiled by a meeting in the round. A round with no exiles does not count."
Achievement.500203.Name: "Skilled Repairs"
Achievement.500203.Description: "Make actually effective repairs to at least 3 different sabotage instances in one round and win with the Crewmates. Each sabotage counts at most once; door fixes do not count."
Achievement.500204.Name: "Righteous Counterattack"
Achievement.500204.Description: "Have at least one Impostor actually die to a valid crewmate-source skill such as Sheriff, Veteran or Bodyguard in the round, then win with the Crewmates."
Achievement.500205.Name: "Critical Meeting"
Achievement.500205.Description: "Exile an Impostor at a meeting, have the win check after that meeting's full death queue actually trigger a Crewmate base win, and win with the Crewmates."
Achievement.500206.Name: "United We Stand"
Achievement.500206.Description: "Win with the Crewmates with at least 3 different crewmate main roles each producing one whitelisted valid skill event."
Achievement.500207.Name: "Comeback Against the Odds"
Achievement.500207.Description: "In the valid side count after a meeting resolution, have crewmates be at least 2 fewer than Impostors, and have the host actually delay the win judgment that should have ended due to an explicitly recorded special rule, then win with the Crewmates."
Achievement.500208.Name: "No One Left Behind"
Achievement.500208.Description: "When the Crewmates win, all valid opening crewmates are alive, connected and never left the Crewmate side. Requires at least 4 valid opening crewmates."
Achievement.500301.Name: "Independent Endgame"
Achievement.500301.Description: "Actually trigger a dedicated base win source as a neutral role and finish as a winner; not merely added by a shared-win rule."
Achievement.500302.Name: "Many-Sided Winner"
Achievement.500302.Description: "In 3 different valid games, actually trigger and win through the dedicated base, snatch or additional win source of 3 different neutral main roles."
Achievement.500303.Name: "Without a Side"
Achievement.500303.Description: "Trigger a neutral role's dedicated base win and, after all additional and shared-win rules, have the final winner list contain only you."
Achievement.500304.Name: "Win by Association"
Achievement.500304.Description: "After you die, actually win through a target-linked additional win rule such as the Follower or Lawyer. All neutral shared wins do not count."
Achievement.500305.Name: "Famous After Death"
Achievement.500305.Description: "Have your death or exile be the necessary trigger event of your dedicated win rule, with that win source actually holding and you finishing as a winner."
Achievement.500306.Name: "One Person Changes the Outcome"
Achievement.500306.Description: "Have a death, valid side-count change or exile caused by your neutral skill trigger that role's base win in the next win check after the full event queue, and finish as a winner."
Achievement.500307.Name: "Turning the Tables"
Achievement.500307.Description: "After an Impostor or Crewmate base-win candidate has been generated, have your neutral snatch rule actually change the win source to your own role and finish as a winner."
Achievement.500308.Name: "All Targets Cleared"
Achievement.500308.Description: "As the Arsonist or Plague Doctor, complete dousing or infection on at least 5 different valid targets in one game, finish all remaining targets the role requires, trigger the corresponding dedicated win and be a final winner."
Achievement.500401.Name: "Add-On Triggered"
Achievement.500401.Description: "Have your add-on role actually produce one valid whitelisted event. Merely loading or being assigned the role does not count."
Achievement.500402.Name: "Change the Outcome Once"
Achievement.500402.Description: "Have your add-on effect actually prevent a death, force a report meeting, or change an exile result through vote or tie-break effect."
Achievement.500403.Name: "Dual Identity"
Achievement.500403.Description: "Have your main role and add-on role each produce at least one valid skill event in one round; their sources must differ."
Achievement.500404.Name: "Synergy of Two Effects"
Achievement.500404.Description: "Have each of your two different add-on roles successfully produce a whitelisted valid event in one round and finish as a winner. Does not count when the room allows only one add-on role."
Achievement.500405.Name: "Effect Chain"
Achievement.500405.Description: "Have your Lovers chain actually kill both lovers, or the Avenger death chain kill you and another player."
Achievement.500406.Name: "Hidden Rule"
Achievement.500406.Description: "Win through the dedicated win source of your Egoist snatch or YouTuber first-kill and have already won in another valid game through another one of those add-on win sources."
