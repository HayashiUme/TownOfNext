Achievement.100101.Name: "正中懸賞"
Achievement.100101.Description: "在懸賞時限內親自擊殺當前懸賞目標"
Achievement.100102.Name: "連環通緝"
Achievement.100102.Description: "同一局內成功完成3次懸賞擊殺，並且內鬼陣營獲勝"
Achievement.100201.Name: "血債未冷"
Achievement.100201.Description: "在自殺倒計時結束前完成一次擊殺"
Achievement.100202.Name: "嗜血終夜"
Achievement.100202.Description: "同一局完成3次擊殺並隨內鬼陣營獲勝，且未因倒計時自殺"
Achievement.100301.Name: "遲來的死亡"
Achievement.100301.Description: "一次吸血成功，並由該次吸血造成目標延遲死亡"
Achievement.100302.Name: "血月盛宴"
Achievement.100302.Description: "同一局中至少2次吸血造成延遲死亡，且內鬼陣營獲勝"
Achievement.100401.Name: "咒令生效"
Achievement.100401.Description: "成功詛咒一名玩家，並由術士發動的詛咒擊殺造成另一名玩家死亡；不計被詛咒者自己的普通擊殺"
Achievement.100402.Name: "借手除敵"
Achievement.100402.Description: "同一局中2次詛咒擊殺實際生效，且內鬼陣營獲勝"
Achievement.100501.Name: "標記與處決"
Achievement.100501.Description: "成功標記目標，並通過變形傳送完成對該目標的擊殺"
Achievement.100502.Name: "無聲抵達"
Achievement.100502.Description: "同一局以刺客傳送刺殺成功擊殺2名不同目標，並存活到內鬼陣營獲勝結算"
Achievement.100601.Name: "緩慢逼近"
Achievement.100601.Description: "殭屍機制至少實際降低一次移動速度後，仍成功擊殺一名玩家；不計單純重複計算冷卻"
Achievement.100602.Name: "不死的終點"
Achievement.100602.Description: "本人的速度已因殭屍機制累計下降至少0.3倍基礎速度，之後仍完成一次擊殺，並隨內鬼陣營獲勝；不使用不存在的“最低檔”字段"
Achievement.100701.Name: "強制報告"
Achievement.100701.Description: "成功駭入一名玩家，並使其報告駭客本輪擊殺的屍體"
Achievement.100702.Name: "無屍報案"
Achievement.100702.Description: "在場上沒有可報告屍體時，駭入實際召開一次特殊會議，並隨內鬼陣營獲勝"
Achievement.100801.Name: "舊管道新出口"
Achievement.100801.Description: "通過變形或解除變形，成功傳送到上一次使用的通風管道"
Achievement.100802.Name: "管道穿梭"
Achievement.100802.Description: "同一局中成功觸發3次礦工傳送，並在其中一次傳送後10秒內完成擊殺"
Achievement.100901.Name: "原點撤離"
Achievement.100901.Description: "標記位置後，與標記點的世界座標距離達到8單位，再成功傳送回標記點；距離與屏幕尺寸無關"
Achievement.100902.Name: "來去無蹤"
Achievement.100902.Description: "一次成功傳送回標記點後10秒內完成擊殺，且內鬼陣營獲勝"
Achievement.101001.Name: "只懂殺戮"
Achievement.101001.Description: "以殺戮機器身份完成一次有效擊殺；職業天然限制只作為機制說明，不額外當作挑戰條件"
Achievement.101002.Name: "純粹的殺意"
Achievement.101002.Description: "同一局完成3次擊殺並隨內鬼陣營獲勝"
Achievement.101101.Name: "會後生效"
Achievement.101101.Description: "詛咒目標後，該目標在會議結束後因詛咒死亡"
Achievement.101102.Name: "未竟的審判"
Achievement.101102.Description: "同一局中2次詛咒均造成會後死亡，且內鬼陣營獲勝"
Achievement.101201.Name: "死後仍有生意"
Achievement.101201.Description: "死亡後使用指定玩家編號指令成功擊殺一名玩家"
Achievement.101202.Name: "幕後終局"
Achievement.101202.Description: "死亡後以黑手黨技能擊殺一名船員，該次死亡觸發的下一次勝負檢查產生內鬼基礎勝利，且最終內鬼陣營獲勝"
Achievement.101301.Name: "煙火試放"
Achievement.101301.Description: "成功放置並引爆至少一枚煙花炸彈，且炸彈造成擊殺"
Achievement.101302.Name: "滿天焰火"
Achievement.101302.Description: "一次引爆造成至少3名其他玩家死亡，並且內鬼陣營獲勝"
Achievement.101401.Name: "直線命中"
Achievement.101401.Description: "用變形起點與終點構成的射線成功狙殺一名玩家"
Achievement.101402.Name: "一箭穿局"
Achievement.101402.Description: "同一局中以狙擊射線完成2次擊殺，並隨內鬼陣營獲勝"
Achievement.101501.Name: "提線開場"
Achievement.101501.Description: "成功標記一名玩家，並由傀儡自動擊殺機制實際造成一名有效目標死亡"
Achievement.101502.Name: "看不見的操縱"
Achievement.101502.Description: "同一局中傀儡自動擊殺機制實際造成2名不同目標死亡，且內鬼陣營獲勝；不計傀儡本人的普通擊殺"
Achievement.101601.Name: "停電狩獵"
Achievement.101601.Description: "在停電期間完成一次擊殺"
Achievement.101602.Name: "黑暗加速"
Achievement.101602.Description: "同一局在停電期間完成2次擊殺，並隨內鬼陣營獲勝"
Achievement.101701.Name: "時間被蝕"
Achievement.101701.Description: "完成擊殺，且由本人蝕時效果使隨後一次會議的最終可用時長實際減少"
Achievement.101702.Name: "沒有時間討論"
Achievement.101702.Description: "同一局中至少2次有效擊殺產生蝕時效果，且至少一次會議的最終時長確實因此減少，並隨內鬼陣營獲勝"
Achievement.101801.Name: "猜中身份"
Achievement.101801.Description: "會議中正確猜測一名玩家的職業並成功將其擊殺"
Achievement.101802.Name: "百發百中"
Achievement.101802.Description: "同一局連續2次有效猜測正確並造成目標死亡，期間沒有錯誤猜測，並隨內鬼陣營獲勝"
Achievement.101901.Name: "有人靠近設備"
Achievement.101901.Description: "一次受監測設備的“有人靠近”狀態從假變為真，並成功生成監管者提示；不統計具體玩家身份"
Achievement.101902.Name: "設備巡夜"
Achievement.101902.Description: "同一局收到至少3次有效靠近提示，覆蓋至少2類設備，並隨內鬼陣營獲勝；同一設備持續有人只計一次，恢復無人後再次有人才重新計數"
Achievement.102001.Name: "冷卻縮短"
Achievement.102001.Description: "成功擊殺後，擊殺冷卻按職業機制實際縮短"
Achievement.102002.Name: "越戰越快"
Achievement.102002.Description: "同一局完成3次有效擊殺，其中至少2次之間未召開會議，且後一次擊殺時冷卻已因本職業縮短，並隨內鬼陣營獲勝"
Achievement.102101.Name: "同歸於盡"
Achievement.102101.Description: "發動自爆並至少炸死一名其他玩家"
Achievement.102102.Name: "最後的爆響"
Achievement.102102.Description: "一次自爆殺死至少3名其他玩家，且本局按規則判定內鬼陣營獲勝"
Achievement.102201.Name: "別碰那具屍體"
Achievement.102201.Description: "擊殺後佈下詭雷，並由報告該屍體的玩家觸發詭雷死亡"
Achievement.102202.Name: "連環誤報"
Achievement.102202.Description: "同一條詭雷連鎖實際造成至少2名不同報告者死亡，且內鬼陣營獲勝"
Achievement.102301.Name: "鎖定目標"
Achievement.102301.Description: "通過變形成功設置或切換一次追蹤目標"
Achievement.102302.Name: "殺戮閃爍"
Achievement.102302.Description: "房主向本人發送一次隊友擊殺閃爍後，本人在下一次會議前完成一次擊殺，且內鬼陣營獲勝"
Achievement.102401.Name: "無屍可報"
Achievement.102401.Description: "成功擊殺一名玩家且因清道夫機制未留下可報告屍體"
Achievement.102402.Name: "蹤跡盡滅"
Achievement.102402.Description: "同一局完成3次清道夫無屍體擊殺，並隨內鬼陣營獲勝"
Achievement.102501.Name: "變臉不停"
Achievement.102501.Description: "同一局成功變形成至少2名不同玩家"
Achievement.102502.Name: "千面難辨"
Achievement.102502.Description: "同一局成功變形成至少4名不同玩家，並在其中一次變形結束後10秒內完成擊殺"
Achievement.102601.Name: "強制加班"
Achievement.102601.Description: "成功給一名符合技能條件的玩家增加短任務"
Achievement.102602.Name: "任務債務"
Achievement.102602.Description: "同一局至少3次成功增加短任務，且至少一名目標完成了可追溯至本人的新增任務，最終內鬼陣營獲勝"
Achievement.102701.Name: "招募成功"
Achievement.102701.Description: "成功將一名可招募玩家轉為叛徒"
Achievement.102702.Name: "擴張組織"
Achievement.102702.Description: "同一局成功招募2名叛徒，且至少一名被招募者存活到內鬼陣營獲勝結算"
Achievement.102801.Name: "清理現場"
Achievement.102801.Description: "成功清理一具屍體，使其無法被報告"
Achievement.102802.Name: "沒有目擊者"
Achievement.102802.Description: "同一局成功清理2名不同死者的屍體，並隨內鬼陣營獲勝"
Achievement.102901.Name: "量子化"
Achievement.102901.Description: "成功使一名目標進入量子幽靈狀態"
Achievement.102902.Name: "幽靈也會消失"
Achievement.102902.Description: "同一局有2名由本人量子化的目標因量子幽靈接觸機制實際死亡，且內鬼陣營獲勝"
Achievement.103001.Name: "奇偶循環"
Achievement.103001.Description: "在一次會議重置後完成首次有效擊殺，並使其按奇數次擊殺規則更新冷卻"
Achievement.103002.Name: "永不空手"
Achievement.103002.Description: "同一局完成至少3次有效擊殺，且奇數次與偶數次冷卻更新均實際生效，並隨內鬼陣營獲勝"
Achievement.103101.Name: "詛咒反擊"
Achievement.103101.Description: "遭遇常規擊殺嘗試時消耗反擊額度、阻止自身死亡並成功殺死兇手"
Achievement.103102.Name: "雙重咒返"
Achievement.103102.Description: "同一局成功觸發2次詛咒反擊並殺死不同兇手，且隨內鬼陣營獲勝；反擊額度不足2次時不參與判定"
Achievement.103201.Name: "交換位置"
Achievement.103201.Description: "通過變形完成一次有效的位置交換"
Achievement.103202.Name: "奪魂瞬移"
Achievement.103202.Description: "成功交換位置後5秒內完成擊殺，同一局達成2次，並隨內鬼陣營獲勝"
Achievement.103302.Name: "連射不歇"
Achievement.103302.Description: "同一輪內連續完成3次有效擊殺，其中後兩次均實際消耗儲存子彈抵消冷卻"
Achievement.103401.Name: "全員黑影"
Achievement.103401.Description: "成功發動隱蔽技能，房主完成對符合條件玩家的統一外觀設置；不要求驗證每個客戶端實際畫面"
Achievement.103402.Name: "黑影脫身"
Achievement.103402.Description: "技能生效期間完成擊殺，並在隨後實際召開的下一次會議中未被放逐，最終內鬼陣營獲勝；沒有後續會議則不滿足"
Achievement.103501.Name: "技能抹除"
Achievement.103501.Description: "會議投票後成功抹除一名符合技能條件的船員的職業技能"
Achievement.103502.Name: "白板時代"
Achievement.103502.Description: "同一局成功抹除2名不同船員的職業技能，並隨內鬼陣營獲勝"
Achievement.103601.Name: "屍體不止一具"
Achievement.103601.Description: "一次有效擊殺觸發肢解機制，且該受害者的多屍體生成已完成；重複屍體不計多次死亡"
Achievement.103602.Name: "滿地殘影"
Achievement.103602.Description: "同一局對3名不同受害者成功觸發肢解多屍體效果，並隨內鬼陣營獲勝；不獎勵報告失敗、卡死或異常交互"
Achievement.103701.Name: "無視防護"
Achievement.103701.Description: "變形期間成功絞殺一名在該次攻擊前具有常規防護狀態的目標；防護類型需在實現時按代碼列入支持白名單"
Achievement.103702.Name: "不留痕跡"
Achievement.103702.Description: "同一局對2名不同目標完成有效絞殺，其中至少一名目標具有可被絞殺繞過的死亡被動，且該被動實際未執行；不把目標本來沒有被動視作成功繞過"
Achievement.103801.Name: "進出無形"
Achievement.103801.Description: "通過通風管道進入並成功退出隱身狀態"
Achievement.103802.Name: "隱身處決"
Achievement.103802.Description: "隱身狀態結束前完成一次擊殺，並隨內鬼陣營獲勝"
Achievement.103901.Name: "任務奪命"
Achievement.103901.Description: "完成一項任務，並由此次船鬼任務技能實際造成目標死亡"
Achievement.103902.Name: "致命清單"
Achievement.103902.Description: "同一局通過船鬼任務技能造成至少3名不同玩家死亡，並隨內鬼陣營獲勝"
Achievement.104001.Name: "失明現場"
Achievement.104001.Description: "擊殺一名玩家並使至少一名符合暗殺者技能房間判斷的其他玩家進入失明狀態"
Achievement.104002.Name: "黑暗中的第二刀"
Achievement.104002.Description: "同一局至少2次擊殺成功使至少一名其他玩家失明，並隨內鬼陣營獲勝"
Achievement.104101.Name: "會前情報"
Achievement.104101.Description: "會議開始時房主成功向本人發送至少一條帶屍體標記的房間情報"
Achievement.104102.Name: "故地重演"
Achievement.104102.Description: "房主發送帶屍體標記的房間情報後，本人在該次會議結束至下一次會議開始之間，於所記錄房間完成一次擊殺，並最終內鬼陣營獲勝；不要求會議清理後的舊屍體繼續存在，也不推斷玩家是否依據情報行動"
Achievement.104201.Name: "拖到角落"
Achievement.104201.Description: "成功拖拽一名目標，並由拖拽倒計時或再次按鍵將其殺死"
Achievement.104202.Name: "誰也找不到"
Achievement.104202.Description: "將拖拽目標帶到距開始拖拽位置至少5個世界座標單位處並以企鵝技能擊殺，同一局對2名不同目標達成，且內鬼陣營獲勝；不累計來回走動路程"
Achievement.104301.Name: "身份盡收眼底"
Achievement.104301.Description: "在配置允許的範圍內，房主成功向本人提供至少一名其他玩家的職業或技能信息；不要求存在全員信息面板"
Achievement.104302.Name: "叛徒現形"
Achievement.104302.Description: "達到設定擊殺數後，首次成功向本人提供一名實際叛徒的識別信息，並隨內鬼陣營獲勝；識別選項關閉或沒有叛徒時不參與"
Achievement.104402.Name: "餘韻成刃"
Achievement.104402.Description: "同一局因兩次不同的有效放逐結算降低擊殺冷卻，並在第二次之後完成一次有效擊殺，最終內鬼陣營獲勝"
Achievement.104501.Name: "閃光彈生效"
Achievement.104501.Description: "發動邪惡擲雷兵閃光彈，並使至少一名符合技能條件的非內鬼玩家實際受到視野限制"
Achievement.104502.Name: "黑暗只屬於敵人"
Achievement.104502.Description: "一次閃光彈實際影響至少3名非內鬼玩家，並在其視野限制持續期間完成擊殺，且內鬼陣營獲勝"
Achievement.200101.Name: "正義猜測"
Achievement.200101.Description: "會議中正確猜測一名技能允許的邪惡目標職業並成功擊殺目標"
Achievement.200102.Name: "一局雙中"
Achievement.200102.Description: "同一局連續2次有效猜測正確並造成目標死亡，期間沒有錯誤猜測，最終船員陣營獲勝"
Achievement.200201.Name: "死裡逃生"
Achievement.200201.Description: "幸運兒遭遇常規擊殺嘗試時成功觸發概率抵擋死亡"
Achievement.200202.Name: "命不該絕"
Achievement.200202.Description: "同一局成功抵擋2次常規擊殺，並隨本局實際所屬陣營獲勝；此項依賴概率，抵擋概率為零時不參與"
Achievement.200301.Name: "任務只做一個"
Achievement.200301.Description: "完成擺爛人開局分配的唯一任務；職業生成的新增任務不影響這項"
Achievement.200302.Name: "懶到最後"
Achievement.200302.Description: "開局任務完成後存活經歷至少2次實際會議，且最終船員陣營獲勝"
Achievement.200401.Name: "眾目睽睽"
Achievement.200401.Description: "因兇手與大明星之外的第三名存活玩家距大明星小於2個世界座標單位，實際阻止一次常規擊殺；不使用“同房間”判據"
Achievement.200402.Name: "不能獨處"
Achievement.200402.Description: "同一局在兩次不同常規擊殺嘗試中，均因上述距離保護而免死，並隨本局實際所屬陣營獲勝"
Achievement.200501.Name: "全員收到快訊"
Achievement.200501.Description: "網紅死亡後成功向至少一名符合條件的其他玩家發送網紅死亡提示"
Achievement.200502.Name: "頭條反擊"
Achievement.200502.Description: "網紅死亡後的下一次會議將直接擊殺網紅的兇手放逐，且船員陣營獲勝；此項不要求已死網紅本人投票"
Achievement.200601.Name: "一票多用"
Achievement.200601.Description: "一次有效投票結算中，市長的票實際按多於1票計入"
Achievement.200602.Name: "關鍵多數"
Achievement.200602.Description: "本人額外票數實際改變一次平票或放逐結果，且結果為放逐內鬼；按本次其餘實際結算規則不變、僅移除本人額外票重算作比較"
Achievement.200701.Name: "一鍵修復"
Achievement.200701.Description: "用一次修復動作成功觸發修理工專屬快速修復，例如單點完成原需多處操作的破壞，或單一開關修復照明"
Achievement.200702.Name: "船上維修王"
Achievement.200702.Description: "同一局成功終止3次不同的破壞實例，其中至少一次使用修理工專屬快速修復，最終船員陣營獲勝；修門不計破壞實例"
Achievement.200801.Name: "精準執法"
Achievement.200801.Description: "以警長技能成功擊殺一名內鬼"
Achievement.200802.Name: "不走火的槍"
Achievement.200802.Description: "同一局以警長技能成功擊殺2名不同內鬼，期間沒有錯誤執法，最終船員陣營獲勝"
Achievement.200901.Name: "憑空報案"
Achievement.200901.Description: "使用通風管道觸發一次虛假屍體報告並成功召開會議"
Achievement.200902.Name: "無屍有罪"
Achievement.200902.Description: "本人虛假報告召開的會議中，本人投票給內鬼並成功將其放逐，且船員陣營獲勝"
Achievement.201001.Name: "紅名之謎"
Achievement.201001.Description: "會議期間房主向本人提供的紅名列表中，包含至少一名實際內鬼；只計信息生成，不推斷已閱讀"
Achievement.201002.Name: "真假紅名"
Achievement.201002.Description: "本人在兩次不同會議中，分別投票給當次本人紅名列表中的實際內鬼，且兩名不同內鬼均在對應會議被放逐"
Achievement.201101.Name: "任務全清"
Achievement.201101.Description: "完成所有任務並成功解鎖至少一名內鬼的紅名提示"
Achievement.201102.Name: "最後一項證據"
Achievement.201102.Description: "完成全部任務後，在下一次會議投票給已獲提示的內鬼並將其放逐，且隨本局實際所屬陣營獲勝"
Achievement.201201.Name: "越做越快"
Achievement.201201.Description: "完成任務後因增速者機制實際提升一次移動速度"
Achievement.201202.Name: "極速完成"
Achievement.201202.Description: "同一局因完成任務實際觸發3次增速，並存活到船員陣營獲勝結算；配置或任務數不足以觸發3次時不參與，不使用“最高檔位”字段"
Achievement.201301.Name: "死因確認"
Achievement.201301.Description: "房主通過法醫能力成功生成並向本人提供一名實際死者的死因信息；不依賴生命面板是否在客戶端打開"
Achievement.201302.Name: "還原兩起案件"
Achievement.201302.Description: "同一局獲得2名不同死者的有效死因信息，並在之後一次會議投票給內鬼並將其放逐，最終船員陣營獲勝"
Achievement.201401.Name: "一換一"
Achievement.201401.Description: "發動獨裁技能並強制放逐目標，隨後獨裁者按技能代價死亡"
Achievement.201402.Name: "以命定罪"
Achievement.201402.Description: "發動獨裁技能成功放逐內鬼，在該次完整會議死亡隊列結算後的勝負檢查中觸發船員基礎勝利，且最終船員陣營獲勝"
Achievement.201501.Name: "報告線索"
Achievement.201501.Description: "本人報告屍體後，房主成功向本人發送偵探線索"
Achievement.201502.Name: "循線追兇"
Achievement.201502.Description: "同一局在兩次不同的報告會議中收到偵探線索，且本人分別投票給對應死者的實際兇手並將其放逐，最終船員陣營獲勝；兇手須為兩名不同玩家，不推斷線索與決策的心理因果"
Achievement.201601.Name: "只此一劍"
Achievement.201601.Description: "使用俠客正義擊殺成功擊殺一名技能允許的邪惡目標"
Achievement.201602.Name: "一劍定局"
Achievement.201602.Description: "俠客擊殺命中內鬼，該次技能死亡隊列處理後的下一次勝負檢查觸發船員基礎勝利，且最終船員陣營獲勝"
Achievement.201701.Name: "位置錯亂"
Achievement.201701.Description: "完成任務並成功觸發兩名不同玩家的位置交換"
Achievement.201702.Name: "傳送連鎖"
Achievement.201702.Description: "同一局觸發3次有效位置交換，並在對局結束時船員陣營獲勝；交換前兩人位置相同的無效傳送不計"
Achievement.201801.Name: "會議延長"
Achievement.201801.Description: "完成任務，且其時間操縱效果使隨後會議的最終可用時長實際增加"
Achievement.201802.Name: "爭取來的時間"
Achievement.201802.Description: "一次會議的最終可用時長因本人任務增益增加至少30秒，並在該會議投票給內鬼並將其放逐；超過時長上限被截斷的部分不計"
Achievement.201901.Name: "戒備反殺"
Achievement.201901.Description: "進入戒備狀態後成功反殺一名嘗試擊殺自己的玩家"
Achievement.201902.Name: "誰動誰死"
Achievement.201902.Description: "同一局觸發2次有效戒備反殺，且至少一名被反殺者屬於內鬼陣營，最終船員陣營獲勝"
Achievement.202001.Name: "替人擋刀"
Achievement.202001.Description: "在附近玩家將被擊殺時成功阻止該次擊殺並與兇手同歸於盡"
Achievement.202002.Name: "最後一道防線"
Achievement.202002.Description: "成功阻止對船員的擊殺並帶走內鬼兇手，且船員陣營獲勝"
Achievement.202101.Name: "賣出贗品"
Achievement.202101.Description: "成功將贗品交給一名玩家"
Achievement.202102.Name: "贗品走火"
Achievement.202102.Description: "由本人發放的贗品實際使持有者在嘗試擊殺時走火自殺，且船員陣營最終獲勝"
Achievement.202201.Name: "閃瞎內鬼"
Achievement.202201.Description: "使用通風管道發動閃光彈，並使至少一名內鬼實際受到視野限制"
Achievement.202202.Name: "趁盲制勝"
Achievement.202202.Description: "一次閃光彈實際影響至少2名內鬼，且在會議開始前、視野限制仍生效時，由船員技能擊殺其中一名；不把會議中的放逐計作失明期間擊殺"
Achievement.202302.Name: "救命恩人"
Achievement.202302.Description: "同一局由本人發放的護盾實際抵擋2次常規擊殺，且船員陣營獲勝；重複發送同一次攻擊提示不計"
Achievement.202401.Name: "占卜有果"
Achievement.202401.Description: "會議中成功發動占卜，房主向本人提供一名目標的信息"
Achievement.202402.Name: "真相揭示"
Achievement.202402.Description: "完成全部任務後，對一名實際內鬼的占卜信息成功提供給本人，且本人在該次會議投票給該目標並將其放逐，最終船員陣營獲勝"
Achievement.202501.Name: "不計入生者"
Achievement.202501.Description: "以活死人身份肉體未死亡地完成一次有效對局；用 `PlayerState.IsDead` 與 `Data.IsDead` 判定，不調用恆為假的普通 `IsAlive()`"
Achievement.202502.Name: "生死之外"
Achievement.202502.Description: "同一勝負檢查快照中，實際活死人規則與“僅將本人作為普通存活船員計入”的比較檢查得出不同基礎結論，並在最終結算時肉體未死且本人獲勝；比較檢查必須無副作用"
Achievement.202601.Name: "正確審判"
Achievement.202601.Description: "使用審判指令成功擊殺一名符合技能邪惡判定的目標"
Achievement.202602.Name: "法槌落下"
Achievement.202602.Description: "同一局連續2次有效審判成功，期間沒有錯誤審判，最終船員陣營獲勝"
Achievement.202701.Name: "最後接觸者"
Achievement.202701.Description: "本人報告屍體後，房主成功向本人發送被害者生前最後接觸玩家的信息"
Achievement.202702.Name: "死亡證詞"
Achievement.202702.Description: "本人獲得的最後接觸者恰為對應死者的實際兇手，並在該次或下一次會議投票給該兇手並將其放逐，最終隨本局實際所屬陣營獲勝"
Achievement.202801.Name: "逝者回應"
Achievement.202801.Description: "報告屍體後成功建立聯繫，且房主成功向本人發送一次有效的亡者是/否回答"
Achievement.202802.Name: "問完最後一問"
Achievement.202802.Description: "在一次會議中成功收到亡者回答，並在該會議投票給對應死者的實際兇手並將其放逐，最終船員陣營獲勝"
Achievement.202901.Name: "看見碎盾"
Achievement.202901.Description: "房主通過觀察者能力向本人發送一次針對其他玩家的有效碎盾提示"
Achievement.202902.Name: "盾後真相"
Achievement.202902.Description: "同一局通過觀察者能力收到3次不同攻擊事件的有效碎盾提示，並在之後一次會議投票給邪惡目標並將其放逐，最終隨本局實際所屬陣營獲勝"
Achievement.203001.Name: "歌頌時刻"
Achievement.203001.Description: "使用通風管道發動歌頌，並對至少一名有效玩家成功執行冷卻重置"
Achievement.203002.Name: "和平之後"
Achievement.203002.Description: "一次歌頌對至少2名擁有擊殺鍵的不同玩家成功執行冷卻重置，且本人存活到船員陣營獲勝結算"
Achievement.203101.Name: "採集樣本"
Achievement.203101.Description: "同一輪成功採集兩名不同玩家的樣本"
Achievement.203102.Name: "樣本指向兇手"
Achievement.203102.Description: "本人樣本信息生成並發送後，在該次或下一次會議投票給樣本對應的實際內鬼並將其放逐，且船員陣營獲勝"
Achievement.203201.Name: "票數互換"
Achievement.203201.Description: "一次會議中對兩名不同玩家成功執行換票結算"
Achievement.203202.Name: "逆轉票局"
Achievement.203202.Description: "本人換票實際改變放逐對象並放逐內鬼，最終船員陣營獲勝；比較時僅關閉本人本次換票，其餘實際結算規則不變"
Achievement.203301.Name: "特殊會議"
Achievement.203301.Description: "成功召開僅能投票給指定兩名玩家的特殊會議"
Achievement.203302.Name: "兩人皆有罪"
Achievement.203302.Description: "本人召開的特殊會議最終按技能規則同時放逐兩名不同的邪惡目標，且船員陣營獲勝"
Achievement.203402.Name: "無路可逃"
Achievement.203402.Description: "同一局由本人封鎖至少3條不同管道，且至少一次敵方進入本人封鎖管道的嘗試被房主明確阻止，最終船員陣營獲勝"
Achievement.300102.Name: "焚盡全場"
Achievement.300102.Description: "將所有符合點火條件的存活玩家全部塗油並成功點火，觸發本人的縱火犯專屬勝利來源，且本人最終獲勝"
Achievement.300201.Name: "請投我一票"
Achievement.300201.Description: "在會議中被投票放逐，觸發本人的小丑勝利來源且本人最終獲勝"
Achievement.300202.Name: "開場謝幕"
Achievement.300202.Description: "在本局第一場實際會議中被放逐，觸發本人的小丑勝利來源且本人最終獲勝"
Achievement.300301.Name: "搭上勝利列車"
Achievement.300301.Description: "存活至結算，並由本人投機者追加勝利規則進入最終贏家名單；僅中立共同勝利不計"
Achievement.300302.Name: "夾縫求生"
Achievement.300302.Description: "本人以投機者身份存活經歷至少3次實際會議，其中至少2次會議各有一名其他玩家被放逐，最終由本人的投機者追加勝利規則獲勝"
Achievement.300401.Name: "任務完成後退場"
Achievement.300401.Description: "完成全部任務後死亡，觸發本人的恐怖分子勝利來源且本人最終獲勝"
Achievement.300402.Name: "危險驅逐"
Achievement.300402.Description: "完成全部任務後被會議放逐，並由此次放逐觸發本人的恐怖分子勝利來源，且本人最終獲勝"
Achievement.300501.Name: "目標出局"
Achievement.300501.Description: "指定的處刑目標被會議放逐，並由本人處刑人專屬勝利規則獲勝"
Achievement.300502.Name: "次會定罪"
Achievement.300502.Description: "處刑目標在本局第二場實際會議結束前被放逐，本人在放逐會議投票給該目標，並由處刑人專屬勝利規則獲勝"
Achievement.300601.Name: "人數反超"
Achievement.300601.Description: "觸發以豺狼人數優勢或平衡人數為依據的基礎勝利，且本人最終以豺狼陣營獲勝；具體人數關係按當前規則判斷，不寫死為嚴格大於"
Achievement.300602.Name: "狼群壯大"
Achievement.300602.Description: "成功招募一名跟班，本人與該跟班均未離開豺狼陣營，且兩人存活到豺狼陣營獲勝結算"
Achievement.300701.Name: "忠實副手"
Achievement.300701.Description: "以跟班身份存活到豺狼陣營獲勝結算，且本人在最終贏家名單中"
Achievement.300702.Name: "接班人"
Achievement.300702.Description: "原豺狼死亡後，本人按啟用的接班規則實際轉為豺狼，並最終取得豺狼陣營勝利；須保留跟班身份歷史"
Achievement.300801.Name: "知道一切"
Achievement.300801.Description: "以神身份存活經歷一次實際會議，且房主成功向本人提供其他玩家身份信息；不以開局分配角色直接贈送"
Achievement.300802.Name: "最後的勝利者"
Achievement.300802.Description: "以神身份存活經歷至少3次實際會議，隨後由本人的神搶奪勝利規則覆蓋既有基礎勝利，且本人最終獲勝；神本身只要求存活，不要求全場只剩自己"
Achievement.300901.Name: "跳管練習"
Achievement.300901.Description: "同一局有效跳管次數達到房主勝利門檻的一半向上取整"
Achievement.300902.Name: "水管冠軍"
Achievement.300902.Description: "本人有效跳管次數達到房主勝利門檻，並由此觸發馬里奧專屬勝利來源且本人最終獲勝"
Achievement.301001.Name: "栽贓成功"
Achievement.301001.Description: "冤罪師技能實際記錄一名有效栽贓目標，且本人因該次栽贓機制死亡"
Achievement.301002.Name: "即刻定罪"
Achievement.301002.Description: "本人栽贓記錄建立後的下一次實際會議就將對應目標放逐，且由本人的冤罪師專屬規則獲勝；不要求已死冤罪師投票"
Achievement.301101.Name: "吞下一個"
Achievement.301101.Description: "成功活吞一名玩家"
Achievement.301102.Name: "滿腹而歸"
Achievement.301102.Description: "同一局活吞至少3名不同玩家，並最終取得鵜鶘陣營勝利"
Achievement.301201.Name: "拉攏成功"
Achievement.301201.Description: "成功完成對一名玩家的拉攏記錄；不等同於目標的主職業或陣營立即轉換"
Achievement.301202.Name: "革命成功"
Achievement.301202.Description: "在倒計時結束前達到房主設定拉攏人數並成功跳管，觸發本人的革命家勝利來源且本人最終獲勝"
Achievement.301301.Name: "只拆情侶"
Achievement.301301.Description: "以FFF團技能成功擊殺一名按當前代碼允許的戀人或海王目標"
Achievement.301302.Name: "單身的勝利"
Achievement.301302.Description: "至少成功擊殺一名FFF團允許目標，並在結算時由本人FFF團專屬追加勝利規則獲勝"
Achievement.301401.Name: "血量見底"
Achievement.301401.Description: "用玩家專屬血量機制將一名目標的血量消耗至零並成功擊殺"
Achievement.301402.Name: "硬碰硬"
Achievement.301402.Description: "同一局通過血量機制完成至少3次有效擊殺，並取得玩家陣營勝利"
Achievement.301501.Name: "每殺必停電"
Achievement.301501.Description: "成功擊殺一名玩家，並由潛藏者技能使電力破壞從未生效變為生效"
Achievement.301502.Name: "黑暗奪權"
Achievement.301502.Description: "同一局通過擊殺實際觸發至少3次不同電力破壞實例，並由本人的潛藏者搶奪勝利規則獲勝；已停電期間重複觸發不計新實例"
Achievement.301601.Name: "加量任務"
Achievement.301601.Description: "完成本人工作狂分配任務總數的一半向上取整；以本次任務分配批次記錄總數，新增批次另行記錄"
Achievement.301602.Name: "永不下班"
Achievement.301602.Description: "完成工作狂當前全部必需任務，實際觸發本人的工作狂勝利來源且本人最終獲勝；不虛構“普通任務+額外任務”的獨立層次，死亡能否獲勝遵循房主選項"
Achievement.301701.Name: "收集選票"
Achievement.301701.Description: "投票給一名玩家並實際增加本人收集票數"
Achievement.301702.Name: "票滿即勝"
Achievement.301702.Description: "在驅逐結算前實際達到集票勝利門檻，由本人的集票者專屬勝利來源獲勝"
Achievement.301801.Name: "同命目標"
Achievement.301801.Description: "使用自爆卡車技能與一名目標同歸於盡"
Achievement.301802.Name: "同歸不同命"
Achievement.301802.Description: "本人自爆目標不在最終贏家名單中，而本人通過自爆卡車專屬追加勝利規則獲勝；不根據“目標所在陣營”推斷目標個人輸贏"
Achievement.301901.Name: "擊殺後護盾"
Achievement.301901.Description: "一次有效擊殺後成功獲得嗜血騎士職業護盾"
Achievement.301902.Name: "護盾連擊"
Achievement.301902.Description: "同一局嗜血騎士護盾實際抵消2次不同的常規擊殺嘗試，並贏得嗜血騎士陣營勝利"
Achievement.302002.Name: "身後紅利"
Achievement.302002.Description: "本人死亡後，仍因下注目標獲勝而通過賭徒專屬追加勝利規則獲勝；僅中立共同勝利不計"
Achievement.302101.Name: "魅惑成功"
Achievement.302101.Description: "成功魅惑一名技能允許的非中立玩家，使其實際轉入魅魔陣營"
Achievement.302102.Name: "魅惑多數"
Achievement.302102.Description: "本人成功魅惑至少2名不同玩家，並以魅魔陣營人數規則觸發基礎勝利，且本人最終獲勝"
Achievement.302201.Name: "選擇陣營"
Achievement.302201.Description: "以貓身份遭遇有效攻擊，由貓機制阻止本次死亡並實際轉換職業；不寫作先死亡後加入陣營"
Achievement.302202.Name: "貓的另一面"
Achievement.302202.Description: "由貓受擊機制完成職業轉換後，以該次轉換獲得的職業或陣營資格進入最終贏家名單；須保留原貓身份及轉換來源，不以結束時是否仍為貓判斷"
Achievement.302301.Name: "感染擴散"
Achievement.302301.Description: "使一名有效目標實際達到疫醫感染完成狀態"
Achievement.302302.Name: "瘟疫終局"
Achievement.302302.Description: "感染全部符合條件的存活玩家，由本人的疫醫專屬勝利來源獲勝"
Achievement.302401.Name: "交換身份"
Achievement.302401.Description: "以連環交換師身份選定目標，且在隨後的會議結束處理階段實際完成職業交換；只選目標不計"
Achievement.302402.Name: "命運洗牌"
Achievement.302402.Description: "本人以連環交換師身份完成交換，之後又被其他交換師換回交換師身份，再主動完成第二次交換，兩次獲得不同主職業，並存活至結算；按同一玩家的身份歷史統計，不要求一直持有交換師職業"
Achievement.302501.Name: "猜測正確"
Achievement.302501.Description: "一次有效猜測實際獲得末日預言家正確記錄"
Achievement.302502.Name: "連猜不敗"
Achievement.302502.Description: "按房主設置完成獲勝所需正確猜測，期間沒有錯誤猜測，並由本人的末日預言家專屬勝利來源獲勝"
Achievement.302601.Name: "出現情敵"
Achievement.302601.Description: "一名玩家因在暗戀對象附近停留達到時長而被實際標記為本人的情敵"
Achievement.302602.Name: "只剩你我"
Achievement.302602.Description: "達到病嬌代碼規定的終局人數與暗戀對象狀態要求，觸發本人的病嬌勝利來源且本人最終獲勝"
Achievement.302701.Name: "退場也開朗"
Achievement.302701.Description: "本人死亡後，通過陽光開朗大男孩專屬追加勝利規則進入最終贏家名單；僅中立共同勝利不計"
Achievement.302702.Name: "謝幕不散場"
Achievement.302702.Description: "在本局第一場會議開始前死亡，之後又完成至少2場實際會議，最終仍通過本人的陽光開朗大男孩追加勝利規則獲勝"
Achievement.302801.Name: "身後代理"
Achievement.302801.Description: "本人已獲分配有效客戶，且以律師身份死亡後未轉換職業；結算時客戶在律師追加勝利檢查前已取得贏家資格，本人通過律師規則追加獲勝，最終本人和客戶均在贏家名單中"
Achievement.302802.Name: "代理人優先"
Achievement.302802.Description: "本人以律師身份存活至勝利結算，客戶在本人律師追加勝利檢查前已取得贏家資格；由本人律師規則實際移除客戶贏家資格並追加本人，且最終本人獲勝、客戶不在贏家名單；中立共同勝利或戀人規則把客戶重新加入時不滿足"
Achievement.302901.Name: "空包有用"
Achievement.302901.Description: "由本人消耗次數發放的空包彈狀態，實際使對應玩家的下一次非自殺擊殺失效；只命中、不觸發攔截不計"
Achievement.302902.Name: "兩次駁回"
Achievement.302902.Description: "同一局本人發放的空包彈實際阻止兩名不同玩家各一次非自殺擊殺，且本人以起訴人身份存活，並通過起訴人專屬追加勝利規則最終獲勝；配置至少允許兩次使用，會議清除未生效空包彈不計次數"
Achievement.600101.Name: "並肩到最後"
Achievement.600101.Description: "兩名戀人都存活到對局結算，並一起獲得勝利"
Achievement.600102.Name: "生死相隨"
Achievement.600102.Description: "一名戀人實際死亡後，另一名戀人按啟用的房間規則實際殉情死亡；向這對戀人各記錄一次有效連鎖，不以“沒有程序錯誤”作為條件"
Achievement.600201.Name: "最後一名內鬼"
Achievement.600201.Description: "成為內鬼陣營最後一名存活者並實際獲得絕境者冷卻增益"
Achievement.600202.Name: "絕境反殺"
Achievement.600202.Description: "絕境增益生效期間完成擊殺，並最終以內鬼陣營獲勝"
Achievement.600301.Name: "人人的戀人"
Achievement.600301.Description: "房主通過海王顯示規則向至少3名不同玩家提供與本人相關的關係標記；不要求驗證客戶端畫面"
Achievement.600302.Name: "萬花叢中過"
Achievement.600302.Description: "以海王附加職業身份存活經歷至少2次實際會議，並最終隨有效所屬陣營獲勝；“不是真實戀人”是機制說明，不另當挑戰"
Achievement.600401.Name: "看清每一票"
Achievement.600401.Description: "一次實際會議投票結算中，房主向本人應用窺視者的非匿名投票顯示規則"
Achievement.600402.Name: "多數的秘密"
Achievement.600402.Description: "一次非匿名投票結果已向本人提供後，本人在隨後實際召開的下一次會議投票給內鬼並將其放逐，最終隨有效所屬陣營獲勝；不把會後顯示結果用於解釋本次投票"
Achievement.600501.Name: "停電不熄"
Achievement.600501.Description: "電力破壞生效且執燈人視野規則啟用期間，完成一項有效任務"
Achievement.600502.Name: "照亮勝局"
Achievement.600502.Description: "同一局在電力破壞生效、執燈人視野規則啟用期間完成至少3項有效任務，並存活到船員陣營獲勝結算"
Achievement.600601.Name: "死亡閃光"
Achievement.600601.Description: "其他玩家死亡時，房主通過靈媒能力成功向本人發送殺戮閃爍提示"
Achievement.600602.Name: "閃光指兇"
Achievement.600602.Description: "收到一次靈媒殺戮閃爍後，在下一次會議投票給該死亡事件的實際兇手並將其放逐，最終隨有效所屬陣營獲勝；不要求閃爍本身透露兇手身份"
Achievement.600701.Name: "先人一步"
Achievement.600701.Description: "在閃電俠速度增益生效時完成一項有效任務"
Achievement.600702.Name: "快如閃電"
Achievement.600702.Description: "同一局在閃電俠速度增益生效期間完成5項有效任務，並存活到所屬陣營獲勝結算"
Achievement.600801.Name: "打破平票"
Achievement.600801.Description: "投票平票時，本人破平效果實際使其投票目標被放逐"
Achievement.600802.Name: "最後一票"
Achievement.600802.Description: "本人破平效果實際使一名內鬼被放逐，並最終隨所屬陣營獲勝"
Achievement.600901.Name: "不能報告"
Achievement.600901.Description: "膽小鬼限制生效時，本人進入一名實際死者屍體的有效報告距離；不要求玩家發送必然被禁止的報告請求"
Achievement.600902.Name: "緘默目擊者"
Achievement.600902.Description: "同一局膽小鬼限制生效時，本人分別進入3名不同死者屍體的有效報告距離，並存活到所屬陣營獲勝結算；不把全場所有未報告屍體自動計入"
Achievement.601001.Name: "視野傳染"
Achievement.601001.Description: "本人被擊殺後，迷幻者效果實際向兇手應用視野限制"
Achievement.601002.Name: "臨死反制"
Achievement.601002.Description: "本人的視野傳染生效後，兇手在下一次會議被放逐，且本人所屬有效陣營最終獲勝；不要求已死本人投票"
Achievement.601101.Name: "暗中協助"
Achievement.601101.Description: "以叛徒身份在一次會議投票給實際船員並將其放逐，最終通過內鬼陣營歸屬獲勝；不使用未定義的“有利行動”"
Achievement.601102.Name: "首刀逆轉"
Achievement.601102.Description: "在首刀叛變或自票叛變模式中實際成為叛徒，並最終通過內鬼陣營歸屬獲勝；記錄轉換原因"
Achievement.601201.Name: "無法維修"
Achievement.601201.Description: "蠢蛋限制生效時，在本人無法修復的破壞期間完成一項有效任務"
Achievement.601202.Name: "各司其職"
Achievement.601202.Description: "同一局在2次不同的、本人受蠢蛋限制無法修復的破壞實例中各完成至少一項任務，這兩次破壞均被其他玩家修復，且本人最終隨有效所屬陣營獲勝"
Achievement.601301.Name: "第一個交卷"
Achievement.601301.Description: "本人按本局加班狂授予規則，因最先完成要求任務而實際獲得該附加職業"
Achievement.601302.Name: "額外工作也做完"
Achievement.601302.Description: "完成由本人的加班狂授予事件額外分配的全部任務，並存活到所屬陣營獲勝結算"
Achievement.601401.Name: "臨終帶走"
Achievement.601401.Description: "被常規擊殺後，本人復仇者效果實際造成一名其他玩家死亡"
Achievement.601402.Name: "仇人同歸"
Achievement.601402.Description: "本人的復仇效果帶走一名事發時敵對陣營玩家，且本人所屬有效陣營最終獲勝；此項依賴隨機目標"
Achievement.601501.Name: "首殺主角"
Achievement.601501.Description: "成為本局第一個被常規擊殺的玩家，實際觸發本人的UP主專屬勝利來源且本人最終獲勝"
Achievement.601502.Name: "這次不領盒飯"
Achievement.601502.Description: "未觸發UP主首殺勝利，本人持有UP主附加職業且肉體未死亡地完成對局，並隨有效所屬陣營獲勝"
Achievement.601601.Name: "勝利獨佔"
Achievement.601601.Description: "本人利己主義者規則實際覆蓋一次原陣營基礎勝利，且本人最終獲勝"
Achievement.601602.Name: "獨享終幕"
Achievement.601602.Description: "本人觸發利己主義者搶奪時，覆蓋前的贏家集合至少包含3名其他玩家；經過全部追加與共同勝利規則後，最終贏家名單只有本人一人；須保留覆蓋前快照"
Achievement.601701.Name: "擊殺攢票"
Achievement.601701.Description: "有效擊殺後，因竊票者機制實際增加本人的額外票數"
Achievement.601702.Name: "暗票定局"
Achievement.601702.Description: "本人的竊票者額外票實際改變放逐結果，並放逐一名事發時敵對陣營玩家；比較時只移除本人額外票，其餘結算規則不變"
Achievement.601801.Name: "人數算雙份"
Achievement.601801.Description: "一次有效勝負檢查中，本人的雙重人格額外人數實際計入；不要求一定改變結果"
Achievement.601802.Name: "多出的一人"
Achievement.601802.Description: "保持同一檢查快照及其餘規則不變，移除本人額外人數會觸發敵對陣營基礎勝利，而實際檢查未觸發；之後本人所屬有效陣營獲勝，比較檢查必須無副作用"
Achievement.601901.Name: "遺留情報"
Achievement.601901.Description: "寶箱怪死亡後，房主向至少一名符合條件的其他內鬼發送本人實際擊殺目標的職業信息"
Achievement.601902.Name: "死亡清單"
Achievement.601902.Description: "本人死亡前實際擊殺2名不同玩家，其寶箱怪情報均被發送給至少一名有效隊友，最終內鬼陣營獲勝"
Achievement.602001.Name: "超距擊殺"
Achievement.602001.Description: "持槍距離增益生效時，在超過本局移除該增益後的普通擊殺距離處成功擊殺；記錄攻擊判定時座標，不用死亡動畫後的距離"
Achievement.602002.Name: "遠程執法"
Achievement.602002.Description: "同一局完成2次上述超距有效擊殺，並隨所屬陣營獲勝"
Achievement.602101.Name: "被迫報案"
Achievement.602101.Description: "本人被擊殺後，誘餌效果實際使兇手報告本人屍體並召開會議"
Achievement.602102.Name: "把兇手叫回來"
Achievement.602102.Description: "本人的誘餌強制報告所召開的會議成功放逐該次死亡的實際兇手，且本人隨有效所屬陣營最終獲勝；不要求已死本人投票"
Achievement.602201.Name: "困住兇手"
Achievement.602201.Description: "本人被擊殺後，陷阱師效果實際限制兇手移動"
Achievement.602202.Name: "陷阱反制"
Achievement.602202.Description: "本人的陷阱效果生效後，兇手在下一次會議被放逐，且本人隨有效所屬陣營最終獲勝；不要求已死本人投票"
Achievement.602301.Name: "顏色失真"
Achievement.602301.Description: "從正式開局到結算一直持有色盲附加職業，且本人肉體未死亡地完成對局；以房主狀態為準，不驗證客戶端是否真正渲染顏色差異"
Achievement.602302.Name: "無色辨敵"
Achievement.602302.Description: "色盲效果規則生效期間，在一次會議中投票給實際內鬼並將其放逐，且隨有效所屬陣營最終獲勝；不推斷顏色差異是否影響玩家判斷"
Achievement.500101.Name: "無人識破"
Achievement.500101.Description: "內鬼陣營獲勝，且本局沒有玩家以當時有效內鬼陣營身份被會議放逐"
Achievement.500102.Name: "同袍無損"
Achievement.500102.Description: "內鬼陣營獲勝時，所有開局有效內鬼仍存活且未轉離陣營；僅有一名開局內鬼時不參與"
Achievement.500103.Name: "暗殺連鎖"
Achievement.500103.Description: "同一局在一次會議結束後、下一次會議開始前，內鬼來源技能累計造成至少3名不同的非內鬼玩家實際死亡，最終內鬼陣營獲勝；自殺與重複屍體不計"
Achievement.500104.Name: "破壞專家"
Achievement.500104.Description: "基礎勝利來源為可終結對局的破壞超時，且最終勝利沒有被豺狼等轉換或被其他角色覆蓋，內鬼陣營最終獲勝"
Achievement.500105.Name: "屍蹤全無"
Achievement.500105.Description: "內鬼陣營獲勝前，其技能對至少3名不同非內鬼玩家造成實際死亡，且這些死亡因對應技能規則未生成可報告屍體；先生成再清理不算“未生成”"
Achievement.500106.Name: "借刀殺人"
Achievement.500106.Description: "內鬼陣營獲勝，且至少一次由內鬼術士或傀儡師等明確操縱來源，使非內鬼執行者造成另一名非內鬼死亡；普通警長誤殺不算內鬼借刀"
Achievement.500107.Name: "一人守夜"
Achievement.500107.Description: "在其他開局內鬼均死亡或被放逐後，本人成為唯一存活內鬼；此後親自完成至少2次有效擊殺，期間沒有新內鬼加入，最終內鬼陣營獲勝；僅發給該玩家，單內鬼開局不參與"
Achievement.500108.Name: "逆風收網"
Achievement.500108.Description: "本局一次會議結算後只剩本人一名存活內鬼，至少另一名開局內鬼已被放逐，且有效存活船員至少4人；此後本人完成至少3次有效擊殺並最終內鬼陣營獲勝；僅發給該玩家，不把普通開局人數差當逆風"
Achievement.500201.Name: "任務閉環"
Achievement.500201.Description: "任務勝利判定實際生效，計入本局船員總進度的全部有效任務均完成，且最終船員陣營獲勝；不要求完成不計總進度的中立或其他專屬任務"
Achievement.500202.Name: "沒有誤判"
Achievement.500202.Description: "船員陣營獲勝，至少一次會議實際放逐了內鬼，且本局沒有有效船員被會議放逐；沒有任何放逐的對局不計"
Achievement.500203.Name: "維修有方"
Achievement.500203.Description: "本人同一局對至少3次不同破壞實例做出實際有效修復，並最終以船員陣營獲勝；每次破壞最多計一次，不計修門或對已修好設備的重複操作"
Achievement.500204.Name: "正義反擊"
Achievement.500204.Description: "本局至少一名內鬼實際死於有效船員來源的警長、老兵、保鏢等技能，最終船員陣營獲勝"
Achievement.500205.Name: "關鍵會議"
Achievement.500205.Description: "一次會議放逐內鬼，該會議完整死亡隊列處理後的勝負檢查實際觸發船員基礎勝利，且最終船員陣營獲勝"
Achievement.500206.Name: "眾志成城"
Achievement.500206.Description: "船員陣營獲勝，且至少3種不同船員主職業各有一次白名單內的有效技能事件；單純分配職業或加載被動狀態不計"
Achievement.500207.Name: "逆境翻盤"
Achievement.500207.Description: "一次會議結算後的有效陣營計數中，船員比內鬼少至少2人，房主因明確記錄的特殊規則實際延後本應結束的勝負判定，之後船員陣營獲勝；僅特殊配置適用，普通模式若已結束則不可能繼續計數"
Achievement.500208.Name: "無人掉隊"
Achievement.500208.Description: "船員陣營獲勝時，所有開局有效船員都存活、未斷線且未轉離船員陣營；開局有效船員至少4人，不通過轉陣營縮小統計集合"
Achievement.500301.Name: "獨立終局"
Achievement.500301.Description: "本人以中立職業實際觸發一次專屬基礎勝利來源，且最終獲勝；不是單純被共同勝利規則加入"
Achievement.500302.Name: "多面贏家"
Achievement.500302.Description: "在3場不同的有效對局中，分別以3種不同中立主職業實際觸發其專屬基礎、搶奪或追加勝利來源並獲勝；按職業集合跨局去重，不僅累計次數"
Achievement.500303.Name: "不靠陣營"
Achievement.500303.Description: "本人觸發中立職業專屬基礎勝利，且全部追加與共同勝利規則處理後，最終贏家名單僅本人一人；不能只通過內鬼與船員沒獲勝來推斷"
Achievement.500304.Name: "借勢而勝"
Achievement.500304.Description: "本人死亡後，通過賭徒、律師等目標關聯的專屬追加勝利規則實際獲勝；不計所有中立共享勝利"
Achievement.500305.Name: "死後成名"
Achievement.500305.Description: "本人死亡或被放逐是其專屬勝利規則的必要觸發事件，且該勝利來源實際成立、本人最終獲勝；以來源白名單區分普通死後共享勝利"
Achievement.500306.Name: "一人改變結局"
Achievement.500306.Description: "本人中立技能引發的死亡、有效陣營計數變化或放逐事件，在完整事件隊列後的下一次勝負檢查中觸發該職業基礎勝利，且本人最終獲勝；保存觸發事件關聯，不推斷“間接促成”"
Achievement.500307.Name: "反客為主"
Achievement.500307.Description: "已生成內鬼或船員基礎勝利候選後，本人的中立搶奪規則實際將勝利來源改為自身職業，且最終獲勝；須記錄覆蓋前後來源，不使用“看似即將獲勝”"
Achievement.500308.Name: "目標全清"
Achievement.500308.Description: "本人作為縱火犯或疫醫，在一局內對至少5名不同有效目標分別完成塗油或感染，並完成該職業所需全部剩餘目標、觸發對應專屬勝利且本人最終獲勝；目標集合由對應職業適配器提供，不泛化到沒有全目標概念的中立"
Achievement.500401.Name: "附加效果已觸發"
Achievement.500401.Description: "本人的附加職業實際產生一次5.5白名單內的有效事件；僅加載、被分配職業或向客戶端設置皮膚不計"
Achievement.500402.Name: "改變一次結局"
Achievement.500402.Description: "本人的附加效果實際阻止一次死亡、強制召開報告會議，或通過票數/破平效果改變放逐結果；按成功事件及無副作用比較結果判定"
Achievement.500403.Name: "雙重身份"
Achievement.500403.Description: "同一局本人主職業與附加職業分別產生至少一次有效技能事件；兩者來源必須不同，不能同一事件重複記作雙來源"
Achievement.500404.Name: "雙效協同"
Achievement.500404.Description: "同一局本人持有的兩種不同附加職業各成功產生白名單有效事件，且本人最終獲勝；房間只允許單附加職業時不參與"
Achievement.500405.Name: "效果連鎖"
Achievement.500405.Description: "本人持有的戀人連鎖實際造成兩名戀人死亡，或復仇者死亡連鎖造成本人及另一名玩家死亡；共享同一連鎖事件ID，每個實際死者僅計一次，不泛算一次視覺同步為多人受影響"
Achievement.500406.Name: "隱藏規則"
Achievement.500406.Description: "本人通過利己主義者搶奪或UP主首殺的專屬勝利來源最終獲勝，且本人已在此前另一場有效對局通過另一種上述附加職業勝利來源獲勝；按兩種來源跨局去重，不要求一次比較所有職業規則"
