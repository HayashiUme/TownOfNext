HotPotatoInfoLong: "Use o botão de matar para passar a Batata Quente a uma Batata Fria antes que a contagem termine, ou você explodirá. Todos podem ver quem está com a Batata Quente."
ColdPotatoInfo: "Evite a Batata Quente"
ColdPotatoInfoLong: "Evite a Batata Quente e sobreviva até o fim. Todos podem ver quem está com a Batata Quente."
TaggerInfo: "Mate seu alvo"
TaggerInfoLong: "Mate o alvo que lhe foi atribuído para herdar o alvo dele. Atacar o alvo errado resulta em punição."

# 模式介绍 / Mode descriptions
ModeDescribe.SoloKombat: "O modo atual é [Combate Solo]\nSem distribuição de funções. Todos têm vida e usam o botão de matar para causar dano. Quem tiver mais abates ao final vence."

# 模式职业 / Mode Roles 
Drafter: "Selecionador"
DrafterInfo: "Escolha sua função na reunião"
DrafterInfoLong: "No modo Seleção de Funções, os jogadores se revezam escolhendo suas funções em uma reunião especial."

# Reviewed proposal metadata; untranslated entries use Chinese fallback.
Achievement.100101.Name: "Recompensa Certeira"
Achievement.100101.Description: "Mate você mesmo o alvo atual da recompensa dentro do prazo."
Achievement.100102.Name: "Caçada em Série"
Achievement.100102.Description: "Complete 3 abates de recompensa na mesma partida e o time Impostor vence."
Achievement.100201.Name: "Dívida de Sangue"
Achievement.100201.Description: "Faça um abate antes de terminar a contagem de suicídio."
Achievement.100202.Name: "Noite de Sangue"
Achievement.100202.Description: "Faça 3 abates na mesma partida, vença com o time Impostor e não morra pela contagem de suicídio."
Achievement.100301.Name: "Morte Atrasada"
Achievement.100301.Description: "Tenha sucesso em uma mordida de vampiro que cause a morte atrasada do alvo."
Achievement.100302.Name: "Banquete da Lua de Sangue"
Achievement.100302.Description: "Ao menos 2 mordidas causam morte atrasada na mesma partida e o time Impostor vence."
Achievement.100401.Name: "Feitiço em Vigor"
Achievement.100401.Description: "Enfeitiçe um jogador com sucesso e o abate do feitiço lançado pelo Controlador de Mentes faz outro jogador morrer."
Achievement.100402.Name: "Matar por Outras Mãos"
Achievement.100402.Description: "2 abates por feitiço se concretizam na mesma partida e o time Impostor vence."
Achievement.100501.Name: "Marcar e Executar"
Achievement.100501.Description: "Marque um alvo com sucesso e mate-o com o teleporte da metamorfose."
Achievement.100502.Name: "Chegada Silenciosa"
Achievement.100502.Description: "Mate 2 alvos diferentes com o ataque de teleporte do Ninja na mesma partida e sobreviva até o time Impostor vencer."
Achievement.100601.Name: "Avanço Lento"
Achievement.100601.Description: "Depois que o mecanismo de zumbi reduzir a velocidade de movimento ao menos uma vez, ainda mate um jogador."
Achievement.100602.Name: "O Fim do Imortal"
Achievement.100602.Description: "Sua velocidade caiu ao menos 0,3 vez a base acumulada pelo mecanismo de zumbi e, depois disso, você ainda faz um abate e vence com o time Impostor."
Achievement.100701.Name: "Reporte Forçado"
Achievement.100701.Description: "Hackeie um jogador com sucesso e faça-o reportar o corpo que o Ilusionista matou nesta rodada."
Achievement.100702.Name: "Reporte sem Corpo"
Achievement.100702.Description: "Quando não há corpos reportáveis no mapa, a habilidade de hackear realmente convoca uma reunião especial e você vence com o time Impostor."
Achievement.100801.Name: "Duto Antigo, Saída Nova"
Achievement.100801.Description: "Pela metamorfose ou reversão, teleporte-se com sucesso para o último duto que usou."
Achievement.100802.Name: "Vaivém de Dutos"
Achievement.100802.Description: "Dispare 3 teleportes de Mineiro na mesma partida e faça um abate dentro de 10 segundos após um deles."
Achievement.100901.Name: "Retirada ao Ponto"
Achievement.100901.Description: "Após marcar um local, alcance 8 unidades de mundo de distância do ponto marcado e então teleporte-se de volta a ele."
Achievement.100902.Name: "Some sem Rastro"
Achievement.100902.Description: "Faça um abate dentro de 10 segundos após um teleporte de volta ao ponto marcado e o time Impostor vence."
Achievement.101001.Name: "Só Sei Matar"
Achievement.101001.Description: "Como Máquina Mortífera, faça um abate válido."
Achievement.101002.Name: "Pura Vontade de Matar"
Achievement.101002.Description: "Faça 3 abates na mesma partida e vença com o time Impostor."
Achievement.101101.Name: "Efeito Pós-Reunião"
Achievement.101101.Description: "Após enfeitiçar um alvo, ele morre pelo feitiço após o fim da reunião."
Achievement.101102.Name: "Julgamento Inacabado"
Achievement.101102.Description: "Na mesma partida, 2 feitiços causam morte após a reunião e o time Impostor vence."
Achievement.101201.Name: "Negócios Depois da Morte"
Achievement.101201.Description: "Após morrer, use o comando com o número do jogador designado para matar um jogador com sucesso."
Achievement.101202.Name: "Fim nos Bastidores"
Achievement.101202.Description: "Após morrer, mate um Tripulante com a habilidade do Mafioso, a próxima checagem de vitória disparada por essa morte gera vitória base dos Impostores e no fim o time Impostor vence."
Achievement.101301.Name: "Teste de Fogos"
Achievement.101301.Description: "Coloque e detone ao menos uma bomba de fogos com sucesso, e a bomba causa um abate."
Achievement.101302.Name: "Fogos por Todo Lado"
Achievement.101302.Description: "Uma detonação mata ao menos 3 outros jogadores e o time Impostor vence."
Achievement.101401.Name: "Acerto em Linha Reta"
Achievement.101401.Description: "Mate um jogador com sucesso usando o raio formado pelo início e pelo fim da metamorfose."
Achievement.101402.Name: "Flecha Decisiva"
Achievement.101402.Description: "Faça 2 abates com o raio do Atirador na mesma partida e vença com o time Impostor."
Achievement.101501.Name: "Abertura de Marionetes"
Achievement.101501.Description: "Marque um jogador com sucesso e o abate automático do Marionetista realmente mata um alvo válido."
Achievement.101502.Name: "Manipulação Invisível"
Achievement.101502.Description: "Na mesma partida, o abate automático do Marionetista realmente mata 2 alvos diferentes e o time Impostor vence."
Achievement.101601.Name: "Caça no Apagão"
Achievement.101601.Description: "Faça um abate durante o apagão."
Achievement.101602.Name: "Aceleração no Escuro"
Achievement.101602.Description: "Faça 2 abates durante o apagão na mesma partida e vença com o time Impostor."
Achievement.101701.Name: "Tempo Corroído"
Achievement.101701.Description: "Faça um abate e seu efeito de corrosão temporal realmente reduz o tempo final disponível da reunião seguinte."
Achievement.101702.Name: "Sem Tempo para Discussão"
Achievement.101702.Description: "Na mesma partida, ao menos 2 abates válidos geram corrosão temporal e ao menos uma reunião tem seu tempo final realmente reduzido por isso, e você vence com o time Impostor."
Achievement.101801.Name: "Identidade Certa"
Achievement.101801.Description: "Adivinhe corretamente a profissão de um jogador na reunião e mate-o com sucesso."
Achievement.101802.Name: "Na Mosca"
Achievement.101802.Description: "2 adivinhações corretas seguidas na mesma partida causam a morte do alvo, sem erros no meio, e você vence com o time Impostor."
Achievement.101901.Name: "Alguém se Aproxima"
Achievement.101901.Description: "O estado de aproximação de um dispositivo monitorado muda de falso para verdadeiro e gera com sucesso um alerta do Anti-Administrador."
Achievement.101902.Name: "Ronda de Dispositivos"
Achievement.101902.Description: "Receba ao menos 3 alertas de aproximação válidos na mesma partida, cobrindo ao menos 2 tipos de dispositivo, e o time Impostor vence."
Achievement.102001.Name: "Recarga Encurtada"
Achievement.102001.Description: "Após um abate bem-sucedido, a recarga de abate realmente diminui pela mecânica da profissão."
Achievement.102002.Name: "Cada Vez Mais Rápido"
Achievement.102002.Description: "Na mesma partida, faça 3 abates válidos, com ao menos um intervalo entre 2 deles sem reunião, e no abate posterior a recarga já estava reduzida por esta profissão, e você vence com o time Impostor."
Achievement.102101.Name: "Fim para Todos"
Achievement.102101.Description: "Ative a autodetonação e mate ao menos um outro jogador."
Achievement.102102.Name: "A Última Explosão"
Achievement.102102.Description: "Uma autodetonação mata ao menos 3 outros jogadores e a partida é decidida como vitória do time Impostor."
Achievement.102201.Name: "Não Toque no Corpo"
Achievement.102201.Description: "Após abater, coloque uma armadilha que é acionada pelo jogador que reporta o corpo, matando-o."
Achievement.102202.Name: "Falsos Alarmes em Série"
Achievement.102202.Description: "Uma mesma corrente de armadilhas realmente mata ao menos 2 reportadores diferentes e o time Impostor vence."
Achievement.102301.Name: "Alvo Travado"
Achievement.102301.Description: "Pela metamorfose, defina ou troque uma vez o alvo de rastreamento com sucesso."
Achievement.102302.Name: "Cintilação de Abate"
Achievement.102302.Description: "Após o anfitrião enviar uma cintilação de abate de aliado, faça um abate antes da próxima reunião e o time Impostor vence."
Achievement.102401.Name: "Sem Corpo para Reportar"
Achievement.102401.Description: "Mate um jogador com sucesso e, pela mecânica do Necrófago, não deixe corpo reportável."
Achievement.102402.Name: "Rastros Apagados"
Achievement.102402.Description: "Faça 3 abates sem corpo com o Necrófago na mesma partida e vença com o time Impostor."
Achievement.102501.Name: "Troca de Rosto"
Achievement.102501.Description: "Transforme-se em ao menos 2 jogadores diferentes na mesma partida."
Achievement.102502.Name: "Mil Faces"
Achievement.102502.Description: "Transforme-se em ao menos 4 jogadores diferentes na mesma partida e faça um abate dentro de 10 segundos após o fim de uma dessas metamorfoses."
Achievement.102601.Name: "Hora Extra Forçada"
Achievement.102601.Description: "Adicione com sucesso uma tarefa curta a um jogador elegível para a habilidade."
Achievement.102602.Name: "Dívida de Tarefas"
Achievement.102602.Description: "Adicione ao menos 3 tarefas curtas com sucesso na mesma partida, ao menos um alvo completa uma tarefa nova rastreável até você, e no fim o time Impostor vence."
Achievement.102701.Name: "Recrutamento Feito"
Achievement.102701.Description: "Converta com sucesso um jogador recrutável em Cúmplice."
Achievement.102702.Name: "Expandir a Organização"
Achievement.102702.Description: "Recrute 2 Cúmplices na mesma partida e ao menos um recrutado sobrevive até a vitória do time Impostor."
Achievement.102801.Name: "Limpar a Cena"
Achievement.102801.Description: "Limpe um corpo com sucesso, deixando-o impossível de reportar."
Achievement.102802.Name: "Sem Testemunhas"
Achievement.102802.Description: "Limpe os corpos de 2 mortos diferentes na mesma partida e vença com o time Impostor."
Achievement.102901.Name: "Quantização"
Achievement.102901.Description: "Faça um alvo entrar em estado de fantasma quântico com sucesso."
Achievement.102902.Name: "Fantasmas Também Somem"
Achievement.102902.Description: "Na mesma partida, 2 alvos quantizados por você morrem de fato pelo mecanismo de contato do fantasma quântico e o time Impostor vence."
Achievement.103001.Name: "Ciclo Par-Ímpar"
Achievement.103001.Description: "Após o reinício de uma reunião, faça o primeiro abate válido e faça a recarga ser atualizada pela regra de abates ímpares."
Achievement.103002.Name: "Nunca de Mãos Vazias"
Achievement.103002.Description: "Faça ao menos 3 abates válidos na mesma partida, com as atualizações de recarga ímpares e pares realmente funcionando, e você vence com o time Impostor."
Achievement.103101.Name: "Contra-Feitiço"
Achievement.103101.Description: "Ao sofrer uma tentativa de abate comum, gaste o crédito de contra-ataque, evite a própria morte e mate o assassino."
Achievement.103102.Name: "Contra-Feitiço Duplo"
Achievement.103102.Description: "Gatilhe 2 contra-feitiços na mesma partida matando assassinos diferentes e vença com o time Impostor."
Achievement.103201.Name: "Troca de Lugar"
Achievement.103201.Description: "Faça uma troca de posição válida por meio da metamorfose."
Achievement.103202.Name: "Teleporte Rouba-Alma"
Achievement.103202.Description: "Faça um abate dentro de 5 segundos após uma troca de posição bem-sucedida, alcance isso 2 vezes na mesma partida e vença com o time Impostor."
Achievement.103302.Name: "Rajada Contínua"
Achievement.103302.Description: "Faça 3 abates válidos seguidos na mesma rodada, sendo que os 2 últimos realmente consomem balas armazenadas para anular a recarga."
Achievement.103401.Name: "Todos na Sombra"
Achievement.103401.Description: "Ative a habilidade de disfarce com sucesso e o anfitrião aplica a aparência padronizada aos jogadores elegíveis."
Achievement.103402.Name: "Fuga Sombria"
Achievement.103402.Description: "Faça um abate durante a vigência da habilidade e não seja exilado na próxima reunião realmente convocada, e no fim o time Impostor vence."
Achievement.103501.Name: "Habilidade Apagada"
Achievement.103501.Description: "Após a votação da reunião, apague com sucesso a habilidade profissional de um Tripulante elegível."
Achievement.103502.Name: "Era do Papel em Branco"
Achievement.103502.Description: "Apague as habilidades de 2 Tripulantes diferentes na mesma partida e vença com o time Impostor."
Achievement.103601.Name: "Mais de Um Corpo"
Achievement.103601.Description: "Um abate válido aciona o mecanismo de desmembramento e a geração de múltiplos corpos da vítima é concluída."
Achievement.103602.Name: "Corpos por Todo Lado"
Achievement.103602.Description: "Acione o efeito de múltiplos corpos por desmembramento em 3 vítimas diferentes na mesma partida e vença com o time Impostor."
Achievement.103701.Name: "Ignorar a Proteção"
Achievement.103701.Description: "Durante a metamorfose, estrangule com sucesso um alvo que tinha proteção comum antes do ataque."
Achievement.103702.Name: "Sem Deixar Rastros"
Achievement.103702.Description: "Faça 2 estrangulamentos válidos em alvos diferentes na mesma partida, sendo que ao menos um alvo tem uma passiva de morte contornável pelo estrangulamento e essa passiva realmente não é executada."
Achievement.103801.Name: "Entrar e Sair Invisível"
Achievement.103801.Description: "Entre por um duto e saia do estado de invisibilidade com sucesso."
Achievement.103802.Name: "Execução Invisível"
Achievement.103802.Description: "Faça um abate antes do fim do estado de invisibilidade e vença com o time Impostor."
Achievement.103901.Name: "A Tarefa Mata"
Achievement.103901.Description: "Complete uma tarefa e a habilidade de tarefa do Trimpostor realmente causa a morte do alvo."
Achievement.103902.Name: "Lista Fatal"
Achievement.103902.Description: "Na mesma partida, a habilidade de tarefa do Trimpostor causa a morte de ao menos 3 jogadores diferentes e você vence com o time Impostor."
Achievement.104001.Name: "Cena Cega"
Achievement.104001.Description: "Mate um jogador e faça ao menos um outro jogador elegível à checagem de sala do Cegador entrar em estado de cegueira."
Achievement.104002.Name: "Segundo Golpe no Escuro"
Achievement.104002.Description: "Na mesma partida, ao menos 2 abates fazem ao menos um outro jogador ficar cego e você vence com o time Impostor."
Achievement.104101.Name: "Informação Pré-Reunião"
Achievement.104101.Description: "No início da reunião, o anfitrião envia a você com sucesso ao menos uma informação de sala com marcação de corpo."
Achievement.104102.Name: "Cena Repetida"
Achievement.104102.Description: "Depois que o anfitrião envia uma informação de sala com marcação de corpo, entre o fim daquela reunião e o início da próxima você faz um abate na sala registrada, e no fim o time Impostor vence."
Achievement.104201.Name: "Arrastar para o Canto"
Achievement.104201.Description: "Arraste um alvo com sucesso e mate-o com o cronômetro de arrasto ou pressionando o botão de novo."
Achievement.104202.Name: "Ninguém Encontra"
Achievement.104202.Description: "Leve o alvo arrastado a pelo menos 5 unidades de mundo do ponto inicial do arrasto e mate-o com a habilidade do Pinguim, alcance isso em 2 alvos diferentes na mesma partida e vença com o time Impostor."
Achievement.104301.Name: "Identidade à Vista"
Achievement.104301.Description: "Dentro do permitido pela configuração, o anfitrião fornece a você com sucesso a profissão ou habilidade de ao menos um outro jogador."
Achievement.104302.Name: "Traidor em Evidência"
Achievement.104302.Description: "Após atingir o número de abates definido, o anfitrião fornece pela primeira vez a você a identificação de um Cúmplice real e você vence com o time Impostor."
Achievement.104402.Name: "Rima Afiada"
Achievement.104402.Description: "Na mesma partida, tenha a recarga de abate reduzida por 2 exílios válidos diferentes e faça um abate válido depois do segundo, e no fim o time Impostor vence."
Achievement.104501.Name: "Flash em Ação"
Achievement.104501.Description: "Use o flash do Granadeiro Maligno e faça ao menos um jogador elegível que não seja Impostor realmente sofrer limitação de visão."
Achievement.104502.Name: "O Escuro é Só do Inimigo"
Achievement.104502.Description: "Um flash realmente afeta ao menos 3 jogadores que não são Impostores e você faz um abate enquanto a limitação de visão deles dura, e o time Impostor vence."
Achievement.200101.Name: "Palpite Justo"
Achievement.200101.Description: "Na reunião, adivinhe corretamente a profissão de um alvo maligno permitido pela habilidade e mate o alvo com sucesso."
Achievement.200102.Name: "Dois Acertos na Partida"
Achievement.200102.Description: "2 adivinhações corretas seguidas na mesma partida causam a morte do alvo, sem erros no meio, e no fim o time Tripulante vence."
Achievement.200201.Name: "Escapada por Pouco"
Achievement.200201.Description: "Quando o Sortudo sofre uma tentativa de abate comum, ele aciona com sucesso a chance de resistir à morte."
Achievement.200202.Name: "Não Era a Hora"
Achievement.200202.Description: "Resista a 2 abates comuns na mesma partida e vença com o time real da partida."
Achievement.200301.Name: "Só uma Tarefa"
Achievement.200301.Description: "Complete a única tarefa distribuída ao Preguiçoso no início."
Achievement.200302.Name: "Preguiçoso até o Fim"
Achievement.200302.Description: "Após completar a tarefa inicial, sobreviva a ao menos 2 reuniões reais e no fim o time Tripulante vence."
Achievement.200401.Name: "À Vista de Todos"
Achievement.200401.Description: "Um terceiro jogador vivo além do assassino e do VIP fica a menos de 2 unidades de mundo do VIP, impedindo de fato um abate comum."
Achievement.200402.Name: "Sem Ficar Sozinho"
Achievement.200402.Description: "Na mesma partida, em 2 tentativas de abate comum diferentes, você sobrevive graças à proteção de distância e vence com o time real da partida."
Achievement.200501.Name: "Todos Recebem a Notícia"
Achievement.200501.Description: "Após a morte da Celebridade, o aviso de morte dela é enviado com sucesso a ao menos um outro jogador elegível."
Achievement.200502.Name: "Contra-Ataque na Manchete"
Achievement.200502.Description: "Na próxima reunião após a morte da Celebridade, o assassino que a matou diretamente é exilado e o time Tripulante vence."
Achievement.200601.Name: "Voto Multiplicado"
Achievement.200601.Description: "Em uma votação válida, o voto do Prefeito realmente conta como mais de 1 voto."
Achievement.200602.Name: "Maioria Decisiva"
Achievement.200602.Description: "Seu voto extra realmente muda um empate ou resultado de exílio, e o resultado é exilar um Impostor."
Achievement.200701.Name: "Reparo com Um Toque"
Achievement.200701.Description: "Com uma única ação de reparo, acione com sucesso o reparo rápido exclusivo do Mecânico, como concluir de um só ponto uma sabotagem que exigiria vários, ou reativar a iluminação com um único interruptor."
Achievement.200702.Name: "Rei do Reparo a Bordo"
Achievement.200702.Description: "Na mesma partida, encerre com sucesso 3 instâncias de sabotagem diferentes, sendo que ao menos uma usa o reparo rápido exclusivo do Mecânico, e no fim o time Tripulante vence."
Achievement.200801.Name: "Tiro Certeiro"
Achievement.200801.Description: "Com a habilidade do Xerife, mate um Impostor com sucesso."
Achievement.200802.Name: "Arma sem Tiro Perdido"
Achievement.200802.Description: "Na mesma partida, mate 2 Impostores diferentes com a habilidade do Xerife, sem tiros errados no meio, e no fim o time Tripulante vence."
Achievement.200901.Name: "Reporte do Nada"
Achievement.200901.Description: "Use um duto para acionar um reporte falso de corpo e convocar uma reunião com sucesso."
Achievement.200902.Name: "Culpado sem Corpo"
Achievement.200902.Description: "Na reunião convocada pelo seu reporte falso, você vota em um Impostor e consegue exilá-lo, e o time Tripulante vence."
Achievement.201001.Name: "O Enigma do Nome Vermelho"
Achievement.201001.Description: "Na lista de nomes vermelhos que o anfitrião fornece durante a reunião, há ao menos um Impostor real."
Achievement.201002.Name: "Nome Vermelho Verdadeiro e Falso"
Achievement.201002.Description: "Em duas reuniões diferentes, você vota em um Impostor real que estava na sua lista de nomes vermelhos daquela vez, e os dois Impostores diferentes são exilados nas reuniões correspondentes."
Achievement.201101.Name: "Tarefas Zeradas"
Achievement.201101.Description: "Complete todas as tarefas e desbloqueie com sucesso o alerta de nome vermelho de ao menos um Impostor."
Achievement.201102.Name: "A Última Evidência"
Achievement.201102.Description: "Após completar todas as tarefas, na próxima reunião vote em um Impostor já alertado e exile-o, e vença com o time real da partida."
Achievement.201201.Name: "Quanto Mais, Mais Rápido"
Achievement.201201.Description: "Após completar uma tarefa, a mecânica do Impulsionador de Velocidade realmente aumenta uma vez sua velocidade de movimento."
Achievement.201202.Name: "Conclusão Relâmpago"
Achievement.201202.Description: "Na mesma partida, complete tarefas acionando 3 vezes o aumento de velocidade do Impulsionador de Velocidade e sobreviva até a vitória do time Tripulante."
Achievement.201301.Name: "Causa da Morte Confirmada"
Achievement.201301.Description: "O anfitrião, pela habilidade do Médico, gera e fornece a você com sucesso a causa da morte de um morto real."
Achievement.201302.Name: "Dois Casos Resolvidos"
Achievement.201302.Description: "Na mesma partida, obtenha a causa da morte válida de 2 mortos diferentes e depois, em uma reunião, vote em um Impostor e exile-o, e no fim o time Tripulante vence."
Achievement.201401.Name: "Um por Um"
Achievement.201401.Description: "Ative a habilidade do Ditador e force o exílio do alvo, e em seguida o Ditador morre pelo custo da habilidade."
Achievement.201402.Name: "Condenação com a Própria Vida"
Achievement.201402.Description: "Ative a habilidade do Ditador e exile um Impostor com sucesso, a checagem de vitória após o processamento completo da fila de mortes dessa reunião aciona vitória base dos Tripulantes, e no fim o time Tripulante vence."
Achievement.201501.Name: "Reportar Pistas"
Achievement.201501.Description: "Após você reportar um corpo, o anfitrião envia a você com sucesso uma pista de Detetive."
Achievement.201502.Name: "Seguindo as Pistas"
Achievement.201502.Description: "Na mesma partida, receba pistas de Detetive em 2 reuniões de reporte diferentes e, em cada uma, vote no verdadeiro assassino do morto correspondente e exile-o, vencendo no fim com o time Tripulante, sendo os assassinos dois jogadores diferentes."
Achievement.201601.Name: "Um Só Golpe"
Achievement.201601.Description: "Use o abate justo do Vigilante para matar com sucesso um alvo maligno permitido pela habilidade."
Achievement.201602.Name: "Golpe Decisivo"
Achievement.201602.Description: "O abate do Vigilante acerta um Impostor, a próxima checagem de vitória após a fila de mortes da habilidade aciona vitória base dos Tripulantes, e no fim o time Tripulante vence."
Achievement.201701.Name: "Posições Trocadas"
Achievement.201701.Description: "Complete uma tarefa e acione com sucesso a troca de posição de dois jogadores diferentes."
Achievement.201702.Name: "Corrente de Teleportes"
Achievement.201702.Description: "Na mesma partida, acione 3 trocas de posição válidas e vença com o time Tripulante ao fim da partida."
Achievement.201801.Name: "Reunião Prorrogada"
Achievement.201801.Description: "Complete uma tarefa e seu efeito de manipulação temporal realmente aumenta o tempo final disponível da reunião seguinte."
Achievement.201802.Name: "Tempo Conquistado"
Achievement.201802.Description: "O tempo final disponível de uma reunião aumenta ao menos 30 segundos pelo seu bônus de tarefa, e nessa reunião você vota em um Impostor e o exila."
Achievement.201901.Name: "Contra-Ataque em Alerta"
Achievement.201901.Description: "Após entrar em estado de alerta, mate de volta com sucesso um jogador que tentou matar você."
Achievement.201902.Name: "Quem Mexe, Morre"
Achievement.201902.Description: "Na mesma partida, acione 2 contra-ataques em alerta válidos, ao menos um dos contra-atacados pertence ao time Impostor, e no fim o time Tripulante vence."
Achievement.202001.Name: "Escudo Humano"
Achievement.202001.Description: "Quando um jogador próximo está prestes a ser morto, impeça esse abate com sucesso e morra junto com o assassino."
Achievement.202002.Name: "A Última Barreira"
Achievement.202002.Description: "Impeça o abate de um Tripulante e leve o assassino Impostor junto, e o time Tripulante vence."
Achievement.202101.Name: "Falsificação Entregue"
Achievement.202101.Description: "Entregue uma falsificação a um jogador com sucesso."
Achievement.202102.Name: "A Falsificação Dispara"
Achievement.202102.Description: "Na mesma partida, a falsificação entregue por você realmente faz o portador se matar por tiro acidental ao tentar abater, e no fim o time Tripulante vence."
Achievement.202201.Name: "Cegar o Impostor"
Achievement.202201.Description: "Use um duto para lançar o flash e faça ao menos um Impostor realmente sofrer limitação de visão."
Achievement.202202.Name: "Vencer na Cegueira"
Achievement.202202.Description: "Um flash realmente afeta ao menos 2 Impostores e, antes da reunião começar, enquanto a limitação de visão ainda está ativa, uma habilidade de Tripulante mata um deles."
Achievement.202302.Name: "Salvador"
Achievement.202302.Description: "Na mesma partida, o escudo que você concedeu realmente resiste a 2 abates comuns e o time Tripulante vence."
Achievement.202401.Name: "Adivinhação com Resultado"
Achievement.202401.Description: "Na reunião, use a adivinhação com sucesso e o anfitrião fornece a você a informação de um alvo."
Achievement.202402.Name: "A Verdade Revelada"
Achievement.202402.Description: "Após completar todas as tarefas, a informação de adivinhação sobre um Impostor real é fornecida a você com sucesso, você vota nesse alvo naquela reunião e o exila, e no fim o time Tripulante vence."
Achievement.202501.Name: "Fora dos Vivos"
Achievement.202501.Description: "Como Glitch, complete uma partida válida sem morrer fisicamente, usando `PlayerState.IsDead` e `Data.IsDead` para a verificação, sem chamar a `IsAlive()` normal, que é sempre falsa."
Achievement.202502.Name: "Além da Vida e da Morte"
Achievement.202502.Description: "No mesmo instantâneo de checagem de vitória, a regra real do Glitch e a checagem comparativa que conta você apenas como um Tripulante vivo comum chegam a conclusões base diferentes, e no fim você vence sem morrer fisicamente."
Achievement.202601.Name: "Julgamento Correto"
Achievement.202601.Description: "Use o comando de julgamento para matar com sucesso um alvo que se enquadra na avaliação maligna da habilidade."
Achievement.202602.Name: "O Martelo Cai"
Achievement.202602.Description: "Na mesma partida, 2 julgamentos válidos seguidos têm sucesso, sem julgamentos errados no meio, e no fim o time Tripulante vence."
Achievement.202701.Name: "Último Contato"
Achievement.202701.Description: "Após você reportar um corpo, o anfitrião envia a você com sucesso a informação do último jogador que a vítima tocou em vida."
Achievement.202702.Name: "Testemunho Fatal"
Achievement.202702.Description: "O último contato obtido por você é justamente o verdadeiro assassino do morto correspondente, e naquela reunião ou na seguinte você vota nesse assassino e o exila, vencendo no fim com o time real da partida."
Achievement.202801.Name: "Resposta do Falecido"
Achievement.202801.Description: "Após reportar um corpo, estabeleça contato com sucesso e o anfitrião envia a você uma resposta válida de sim/não do morto."
Achievement.202802.Name: "A Última Pergunta"
Achievement.202802.Description: "Em uma reunião, receba com sucesso a resposta do morto e vote nessa reunião no verdadeiro assassino do morto correspondente, exilando-o, e no fim o time Tripulante vence."
Achievement.202901.Name: "Escudo Estilhaçado"
Achievement.202901.Description: "O anfitrião, pela habilidade do Observador, envia a você um aviso válido de escudo quebrado referente a outro jogador."
Achievement.202902.Name: "A Verdade Atrás do Escudo"
Achievement.202902.Description: "Na mesma partida, receba pela habilidade do Observador 3 avisos válidos de escudo quebrado de eventos de ataque diferentes e depois, em uma reunião, vote em um alvo maligno e o exile, vencendo no fim com o time real da partida."
Achievement.203001.Name: "Momento do Hino"
Achievement.203001.Description: "Use um duto para entoar o hino e redefinir com sucesso a recarga de ao menos um jogador válido."
Achievement.203002.Name: "Depois da Paz"
Achievement.203002.Description: "Um hino redefine com sucesso a recarga de ao menos 2 jogadores diferentes que possuem o botão de abate, e você sobrevive até a vitória do time Tripulante."
Achievement.203101.Name: "Coletar Amostras"
Achievement.203101.Description: "Na mesma rodada, colete amostras de dois jogadores diferentes com sucesso."
Achievement.203102.Name: "A Amostra Aponta o Culpado"
Achievement.203102.Description: "Depois que a informação da sua amostra é gerada e enviada, naquela reunião ou na seguinte você vota no Impostor real correspondente à amostra e o exila, e o time Tripulante vence."
Achievement.203201.Name: "Troca de Votos"
Achievement.203201.Description: "Em uma reunião, realize com sucesso uma troca de votos entre dois jogadores diferentes."
Achievement.203202.Name: "Vira o Jogo de Votos"
Achievement.203202.Description: "Sua troca de votos realmente muda o exilado e exila um Impostor, e no fim o time Tripulante vence."
Achievement.203301.Name: "Reunião Especial"
Achievement.203301.Description: "Convoque com sucesso uma reunião especial em que só é possível votar em dois jogadores designados."
Achievement.203302.Name: "Os Dois São Culpados"
Achievement.203302.Description: "A reunião especial convocada por você, pelas regras da habilidade, exila ao mesmo tempo dois alvos malignos diferentes, e o time Tripulante vence."
Achievement.203402.Name: "Sem Saída"
Achievement.203402.Description: "Na mesma partida, você bloqueia ao menos 3 dutos diferentes e ao menos uma tentativa inimiga de entrar em um duto bloqueado por você é claramente impedida pelo anfitrião, e no fim o time Tripulante vence."
Achievement.300102.Name: "Tudo em Chamas"
Achievement.300102.Description: "Encharque todos os jogadores vivos que atendem às condições de ignição e acenda o fogo com sucesso, acionando sua fonte de vitória exclusiva de Incendiário, e no fim você vence."
Achievement.300201.Name: "Votem em Mim"
Achievement.300201.Description: "Seja votado e exilado em uma reunião, acionando sua fonte de vitória de Palhaço, e no fim você vence."
Achievement.300202.Name: "Aplausos de Abertura"
Achievement.300202.Description: "Seja exilado na primeira reunião real da partida, acionando sua fonte de vitória de Palhaço, e no fim você vence."
Achievement.300301.Name: "Pegar o Trem da Vitória"
Achievement.300301.Description: "Sobreviva até o fim e entre na lista final de vencedores pela sua regra de vitória adicional de Oportunista."
Achievement.300302.Name: "Sobreviver nas Frestas"
Achievement.300302.Description: "Como Oportunista, sobreviva a ao menos 3 reuniões reais, sendo que ao menos 2 delas exilam um outro jogador cada, e no fim você vence pela sua regra de vitória adicional de Oportunista."
Achievement.300401.Name: "Saída Após as Tarefas"
Achievement.300401.Description: "Morra após completar todas as tarefas, acionando sua fonte de vitória de Terrorista, e no fim você vence."
Achievement.300402.Name: "Expulsão Perigosa"
Achievement.300402.Description: "Após completar todas as tarefas, seja exilado em reunião e esse exílio aciona sua fonte de vitória de Terrorista, e no fim você vence."
Achievement.300501.Name: "Alvo Fora"
Achievement.300501.Description: "O alvo de execução designado é exilado em reunião e você vence pela sua regra de vitória exclusiva de Executor."
Achievement.300502.Name: "Condenação na Segunda Reunião"
Achievement.300502.Description: "O alvo de execução é exilado antes do fim da segunda reunião real da partida, você vota nesse alvo na reunião do exílio e vence pela regra de vitória exclusiva de Executor."
Achievement.300601.Name: "Virada de Números"
Achievement.300601.Description: "Acione a vitória base com base na vantagem numérica dos Chacais ou em números equilibrados, e no fim você vence com o time Chacal."
Achievement.300602.Name: "A Matilha Cresce"
Achievement.300602.Description: "Recrute um Cúmplice com sucesso, nem você nem o Cúmplice saem do time Chacal, e ambos sobrevivem até a vitória do time Chacal."
Achievement.300701.Name: "Braço Direito Leal"
Achievement.300701.Description: "Como Cúmplice, sobreviva até a vitória do time Chacal e esteja na lista final de vencedores."
Achievement.300702.Name: "Sucessor"
Achievement.300702.Description: "Após a morte do Chacal original, você se torna Chacal de fato pela regra de sucessão ativada e no fim conquista a vitória do time Chacal."
Achievement.300801.Name: "Saber de Tudo"
Achievement.300801.Description: "Como Deus, sobreviva a uma reunião real e o anfitrião fornece a você com sucesso informações sobre outros jogadores."
Achievement.300802.Name: "O Último Vencedor"
Achievement.300802.Description: "Como Deus, sobreviva a ao menos 3 reuniões reais e então sua regra de tomada de vitória de Deus sobrepõe a vitória base existente, e no fim você vence."
Achievement.300901.Name: "Treino de Saltos"
Achievement.300901.Description: "Na mesma partida, o número de saltos de duto válidos atinge a metade da meta de vitória do anfitrião, arredondada para cima."
Achievement.300902.Name: "Campeão dos Dutos"
Achievement.300902.Description: "Seus saltos de duto válidos atingem a meta de vitória do anfitrião, acionando sua fonte de vitória exclusiva de Mario, e no fim você vence."
Achievement.301001.Name: "Incriminação Bem-Sucedida"
Achievement.301001.Description: "A habilidade do Inocente realmente registra um alvo de incriminação válido e você morre pelo mecanismo dessa incriminação."
Achievement.301002.Name: "Condenação Imediata"
Achievement.301002.Description: "Na próxima reunião real após o seu registro de incriminação, o alvo correspondente é exilado e você vence pela sua regra exclusiva de Inocente."
Achievement.301101.Name: "Engolir Um"
Achievement.301101.Description: "Engula vivo um jogador com sucesso."
Achievement.301102.Name: "Voltar de Barriga Cheia"
Achievement.301102.Description: "Engula vivos ao menos 3 jogadores diferentes na mesma partida e no fim conquiste a vitória do time Glutão."
Achievement.301201.Name: "Alistamento Feito"
Achievement.301201.Description: "Conclua com sucesso o registro de alistamento de um jogador."
Achievement.301202.Name: "Revolução Bem-Sucedida"
Achievement.301202.Description: "Antes de terminar a contagem regressiva, atinja o número de alistados definido pelo anfitrião e faça o salto de duto com sucesso, acionando sua fonte de vitória de Revolucionista, e no fim você vence."
Achievement.301301.Name: "Só Desfaz Casais"
Achievement.301301.Description: "Com a habilidade do Odiador, mate com sucesso um alvo Amante ou Netuno permitido pelo código atual."
Achievement.301302.Name: "Vitória dos Solteiros"
Achievement.301302.Description: "Mate com sucesso ao menos um alvo permitido pelo Odiador e, no fim, vença pela sua regra de vitória adicional exclusiva de Odiador."
Achievement.301401.Name: "Vida Esgotada"
Achievement.301401.Description: "Com o mecanismo de vida exclusivo do Demônio, reduza a vida de um alvo a zero e mate-o com sucesso."
Achievement.301402.Name: "Choque Direto"
Achievement.301402.Description: "Na mesma partida, faça ao menos 3 abates válidos com o mecanismo de vida e conquiste a vitória do time do Demônio."
Achievement.301501.Name: "Cada Morte, Um Apagão"
Achievement.301501.Description: "Mate um jogador com sucesso e a habilidade do Perseguidor faz a sabotagem de energia passar de inativa para ativa."
Achievement.301502.Name: "Tomada de Poder no Escuro"
Achievement.301502.Description: "Na mesma partida, seus abates acionam ao menos 3 instâncias diferentes de sabotagem de energia e você vence pela sua regra de tomada de vitória de Perseguidor."
Achievement.301601.Name: "Tarefas em Dobro"
Achievement.301601.Description: "Complete metade do total de tarefas que você distribuiu como Trabalhador, arredondada para cima."
Achievement.301602.Name: "Nunca Saio do Turno"
Achievement.301602.Description: "Complete todas as tarefas obrigatórias atuais do Trabalhador, acionando de fato sua fonte de vitória de Trabalhador, e no fim você vence."
Achievement.301701.Name: "Coletar Votos"
Achievement.301701.Description: "Vote em um jogador e realmente aumente seu número de votos coletados."
Achievement.301702.Name: "Votos Completos, Vitória Garantida"
Achievement.301702.Description: "Antes do processamento da expulsão, atinja de fato a meta de votos coletados e vença pela sua fonte de vitória exclusiva de Coletor."
Achievement.301801.Name: "Destino Compartilhado"
Achievement.301801.Description: "Use a habilidade do Provocador e morra junto com um alvo."
Achievement.301802.Name: "Mesmo Fim, Destinos Diferentes"
Achievement.301802.Description: "Seu alvo de autodetonação não está na lista final de vencedores, mas você vence pela sua regra de vitória adicional exclusiva de Provocador."
Achievement.301901.Name: "Escudo Após o Abate"
Achievement.301901.Description: "Após um abate válido, obtenha com sucesso o escudo de profissão do Cavaleiro Sangrento."
Achievement.301902.Name: "Combo de Escudos"
Achievement.301902.Description: "Na mesma partida, o escudo do Cavaleiro Sangrento realmente anula 2 tentativas de abate comum diferentes e você conquista a vitória do time Cavaleiro Sangrento."
Achievement.302002.Name: "Bônus Póstumo"
Achievement.302002.Description: "Após sua morte, você ainda vence pela regra de vitória adicional exclusiva de Seguidor porque o alvo apostado venceu."
Achievement.302101.Name: "Encantamento Bem-Sucedido"
Achievement.302101.Description: "Encante com sucesso um jogador não neutro permitido pela habilidade, fazendo-o realmente entrar no time Cultista."
Achievement.302102.Name: "Maioria Encantada"
Achievement.302102.Description: "Você encanta com sucesso ao menos 2 jogadores diferentes e aciona a vitória base pela regra de número do time Cultista, e no fim você vence."
Achievement.302201.Name: "Escolher o Lado"
Achievement.302201.Description: "Como Gato de Schrödinger, sofra um ataque válido, tenha essa morte impedida pelo mecanismo do Gato e realmente troque de profissão."
Achievement.302202.Name: "O Outro Lado do Gato"
Achievement.302202.Description: "Após a troca de profissão pelo mecanismo de dano do Gato, entre na lista final de vencedores com a qualificação de profissão ou time obtida nessa troca."
Achievement.302301.Name: "Infecção se Espalha"
Achievement.302301.Description: "Faça um alvo válido realmente atingir o estado de infecção completa do Médico da Peste."
Achievement.302302.Name: "Fim da Peste"
Achievement.302302.Description: "Infecte todos os jogadores vivos elegíveis e vença pela sua fonte de vitória exclusiva de Médico da Peste."
Achievement.302401.Name: "Troca de Identidade"
Achievement.302401.Description: "Como Metamorfo, escolha um alvo e a troca de profissão realmente acontece na fase de processamento após a reunião seguinte."
Achievement.302402.Name: "Embaralhar o Destino"
Achievement.302402.Description: "Você completa uma troca como Metamorfo, depois tem sua identidade de Metamorfo trocada de volta por outro Metamorfo, realiza voluntariamente uma segunda troca e recebe duas profissões principais diferentes, sobrevivendo até o fim."
Achievement.302501.Name: "Palpite Certeiro"
Achievement.302501.Description: "Uma adivinhação válida realmente rende um registro correto do Profeta do Apocalipse."
Achievement.302502.Name: "Sequência Perfeita"
Achievement.302502.Description: "Complete o número de adivinhações corretas exigido para vencer conforme a configuração do anfitrião, sem erros no meio, e vença pela sua fonte de vitória exclusiva de Profeta do Apocalipse."
Achievement.302601.Name: "Rival à Vista"
Achievement.302601.Description: "Um jogador é realmente marcado como seu rival por permanecer perto do seu amor por tempo suficiente."
Achievement.302602.Name: "Só Nós Dois"
Achievement.302602.Description: "Atinja o número de jogadores no fim e os requisitos de estado do amor definidos pelo código da Yandere, acionando sua fonte de vitória de Yandere, e no fim você vence."
Achievement.302701.Name: "Saída Radiante"
Achievement.302701.Description: "Após sua morte, entre na lista final de vencedores pela regra de vitória adicional exclusiva do Garoto Solar."
Achievement.302702.Name: "O Show Não Para"
Achievement.302702.Description: "Morra antes do início da primeira reunião da partida, depois presencie ao menos 2 reuniões reais e no fim ainda vença pela sua regra de vitória adicional de Garoto Solar."
Achievement.302801.Name: "Advogado Post Mortem"
Achievement.302801.Description: "Você já tem um cliente válido designado e não troca de profissão após morrer como Advogado, o cliente já tem a qualificação de vencedor antes da checagem de vitória adicional do Advogado, você vence pela regra de Advogado, e no fim você e o cliente estão na lista de vencedores."
Achievement.302802.Name: "Prioridade do Advogado"
Achievement.302802.Description: "Você sobrevive até o fim como Advogado e o cliente já tem a qualificação de vencedor antes da sua checagem de vitória adicional de Advogado, sua regra de Advogado realmente remove a qualificação do cliente e adiciona a sua, e no fim você vence e o cliente não está na lista de vencedores."
Achievement.302901.Name: "Bala Falsa Útil"
Achievement.302901.Description: "O estado de bala falsa que você concede gastando uma carga realmente anula o próximo abate não suicida do jogador correspondente."
Achievement.302902.Name: "Duas Recusas"
Achievement.302902.Description: "Na mesma partida, as balas falsas que você concede realmente impedem dois jogadores diferentes de fazer um abate não suicida cada, você sobrevive como Promotor e no fim vence pela regra de vitória adicional exclusiva de Promotor."
Achievement.600101.Name: "Lado a Lado até o Fim"
Achievement.600101.Description: "Os dois Amantes sobrevivem até o fim da partida e vencem juntos."
Achievement.600102.Name: "Juntos na Vida e na Morte"
Achievement.600102.Description: "Após um Amante morrer de fato, o outro morre de luto conforme a regra ativada da sala."
Achievement.600201.Name: "O Último Impostor"
Achievement.600201.Description: "Torne-se o último sobrevivente do time Impostor e realmente receba o bônus de recarga do Último Impostor."
Achievement.600202.Name: "Virada no Desespero"
Achievement.600202.Description: "Faça um abate durante a vigência do bônus de desespero e no fim vença com o time Impostor."
Achievement.600301.Name: "O Amor de Todos"
Achievement.600301.Description: "O anfitrião, pela regra de exibição do Netuno, fornece a ao menos 3 jogadores diferentes uma marca de relacionamento ligada a você."
Achievement.600302.Name: "Entre Muitas Flores"
Achievement.600302.Description: "Como atributo Netuno, sobreviva a ao menos 2 reuniões reais e no fim vença com o time válido ao qual pertence."
Achievement.600401.Name: "Ver Cada Voto"
Achievement.600401.Description: "Em uma votação de reunião real, o anfitrião aplica a você a regra de exibição de votos não anônimos do Visão de Voto."
Achievement.600402.Name: "O Segredo da Maioria"
Achievement.600402.Description: "Depois que um resultado de votação não anônima é fornecido a você, na próxima reunião realmente convocada você vota em um Impostor e o exila, vencendo no fim com o time válido ao qual pertence."
Achievement.600501.Name: "Apagão Aceso"
Achievement.600501.Description: "Enquanto a sabotagem de energia está ativa e a regra de visão da Tocha está habilitada, complete uma tarefa válida."
Achievement.600502.Name: "Iluminar a Vitória"
Achievement.600502.Description: "Na mesma partida, complete ao menos 3 tarefas válidas durante a sabotagem de energia ativa e a regra de visão da Tocha habilitada, e sobreviva até a vitória do time Tripulante."
Achievement.600601.Name: "Flash de Morte"
Achievement.600601.Description: "Quando outro jogador morre, o anfitrião, pela habilidade do Preditor, envia a você com sucesso um aviso de cintilação de abate."
Achievement.600602.Name: "O Flash Aponta o Culpado"
Achievement.600602.Description: "Após receber uma cintilação de abate do Preditor, na próxima reunião você vota no verdadeiro assassino daquele evento de morte e o exila, vencendo no fim com o time válido ao qual pertence."
Achievement.600701.Name: "Um Passo à Frente"
Achievement.600701.Description: "Complete uma tarefa válida enquanto o bônus de velocidade do Flash está ativo."
Achievement.600702.Name: "Rápido como um Raio"
Achievement.600702.Description: "Na mesma partida, complete 5 tarefas válidas durante o bônus de velocidade do Flash e sobreviva até a vitória do seu time."
Achievement.600801.Name: "Quebrar o Empate"
Achievement.600801.Description: "Em um empate de votação, seu efeito de desempate realmente faz o alvo do seu voto ser exilado."
Achievement.600802.Name: "O Voto Decisivo"
Achievement.600802.Description: "Seu efeito de desempate realmente faz um Impostor ser exilado, e no fim você vence com o seu time."
Achievement.600901.Name: "Não Pode Reportar"
Achievement.600901.Description: "Enquanto a restrição do Alheio está ativa, você entra na distância válida de reporte do corpo de um morto real."
Achievement.600902.Name: "Testemunha Silenciosa"
Achievement.600902.Description: "Na mesma partida, enquanto a restrição do Alheio está ativa, você entra na distância válida de reporte dos corpos de 3 mortos diferentes e sobrevive até a vitória do seu time."
Achievement.601001.Name: "Visão Contagiosa"
Achievement.601001.Description: "Após você ser morto, o efeito do Perplexo realmente aplica limitação de visão ao assassino."
Achievement.601002.Name: "Contra-Golpe na Morte"
Achievement.601002.Description: "Após seu contágio de visão entrar em vigor, o assassino é exilado na próxima reunião e no fim seu time válido vence."
Achievement.601101.Name: "Ajuda Oculta"
Achievement.601101.Description: "Como Cúmplice, em uma reunião vote em um Tripulante real e exile-o, vencendo no fim pela associação ao time Impostor."
Achievement.601102.Name: "Virada na Primeira Morte"
Achievement.601102.Description: "Nos modos de virada por primeiro abate ou autovoto, você realmente se torna Cúmplice e no fim vence pela associação ao time Impostor."
Achievement.601201.Name: "Não Dá para Consertar"
Achievement.601201.Description: "Enquanto a restrição do Travesso está ativa, complete uma tarefa válida durante uma sabotagem que você não consegue reparar."
Achievement.601202.Name: "Cada Um no Seu Papel"
Achievement.601202.Description: "Na mesma partida, em 2 instâncias diferentes de sabotagem que você não consegue reparar por causa da restrição do Travesso, complete ao menos uma tarefa em cada, e as duas sabotagens são reparadas por outros jogadores, e no fim você vence com o seu time válido."
Achievement.601301.Name: "Primeiro a Entregar"
Achievement.601301.Description: "Conforme a regra de concessão do Burro de Carga da partida, você realmente recebe esse atributo por ser o primeiro a completar as tarefas exigidas."
Achievement.601302.Name: "Trabalho Extra Concluído"
Achievement.601302.Description: "Complete todas as tarefas extra atribuídas pelo seu evento de concessão de Burro de Carga e sobreviva até a vitória do seu time."
Achievement.601401.Name: "Levar Alguém na Morte"
Achievement.601401.Description: "Após ser morto por um abate comum, seu efeito de Vingador realmente causa a morte de outro jogador."
Achievement.601402.Name: "Rival Levado Junto"
Achievement.601402.Description: "Seu efeito de vingança leva junto um jogador que era do time inimigo na hora do ocorrido e no fim seu time válido vence."
Achievement.601501.Name: "Protagonista do Primeiro Abate"
Achievement.601501.Description: "Torne-se o primeiro jogador morto por abate comum da partida, acionando de fato sua fonte de vitória exclusiva de Troll, e no fim você vence."
Achievement.601502.Name: "Desta Vez Não Morro"
Achievement.601502.Description: "Você não aciona a vitória de primeiro abate do Troll, mas possui o atributo Troll e completa a partida sem morrer fisicamente, vencendo com o seu time válido."
Achievement.601601.Name: "Vitória Exclusiva"
Achievement.601601.Description: "Sua regra de Egoísta realmente sobrepõe uma vitória base do time original e no fim você vence."
Achievement.601602.Name: "Ato Final Exclusivo"
Achievement.601602.Description: "Quando você aciona a tomada de vitória do Egoísta, o conjunto de vencedores antes da sobreposição continha ao menos 3 outros jogadores, e após todas as regras adicionais e de vitória comum, a lista final de vencedores contém apenas você."
Achievement.601701.Name: "Abates Viram Votos"
Achievement.601701.Description: "Após um abate válido, o mecanismo do Ladrão realmente aumenta seu número de votos extra."
Achievement.601702.Name: "Voto Secreto Decisivo"
Achievement.601702.Description: "Seus votos extra de Ladrão realmente mudam o resultado do exílio e exilam um jogador que era do time inimigo na hora do ocorrido."
Achievement.601801.Name: "Contagem em Dobro"
Achievement.601801.Description: "Em uma checagem de vitória válida, seu número extra de Esquizofrênico realmente é contabilizado."
Achievement.601802.Name: "O Jogador a Mais"
Achievement.601802.Description: "Com o mesmo instantâneo de checagem e as demais regras inalteradas, remover seu número extra acionaria a vitória base do time inimigo, mas a checagem real não aciona, e depois seu time válido vence."
Achievement.601901.Name: "Informação Deixada"
Achievement.601901.Description: "Após a morte do Mímico, o anfitrião envia a ao menos um outro Impostor elegível a informação da profissão do alvo que você realmente matou."
Achievement.601902.Name: "Lista da Morte"
Achievement.601902.Description: "Antes de morrer, você realmente mata 2 jogadores diferentes, as informações de Mímico de ambos são enviadas a ao menos um aliado válido e no fim o time Impostor vence."
Achievement.602001.Name: "Abate Fora de Alcance"
Achievement.602001.Description: "Enquanto o bônus de distância do Alcançador está ativo, mate com sucesso a uma distância maior que a distância normal de abate da partida sem esse bônus."
Achievement.602002.Name: "Execução à Distância"
Achievement.602002.Description: "Na mesma partida, faça 2 desses abates válidos fora de alcance e vença com o seu time."
Achievement.602101.Name: "Denúncia Forçada"
Achievement.602101.Description: "Após você ser morto, o efeito do Armador realmente faz o assassino reportar seu corpo e convocar uma reunião."
Achievement.602102.Name: "Chamar o Assassino de Volta"
Achievement.602102.Description: "A reunião convocada pelo reporte forçado do seu Armador exila com sucesso o verdadeiro assassino daquela morte, e no fim você vence com o seu time válido."
Achievement.602201.Name: "Prender o Assassino"
Achievement.602201.Description: "Após você ser morto, o efeito do Imobilizador realmente limita o movimento do assassino."
Achievement.602202.Name: "Contra-Armadilha"
Achievement.602202.Description: "Após seu efeito de armadilha entrar em vigor, o assassino é exilado na próxima reunião e no fim você vence com o seu time válido."
Achievement.602301.Name: "Cores Distorcidas"
Achievement.602301.Description: "Do início efetivo da partida até o fim, você mantém o atributo Daltônico e completa a partida sem morrer fisicamente."
Achievement.602302.Name: "Distinguir Inimigos sem Cor"
Achievement.602302.Description: "Durante a vigência da regra do efeito Daltônico, em uma reunião você vota em um Impostor real e o exila, vencendo no fim com o seu time válido."
Achievement.500101.Name: "Que Ninguém Descubra"
Achievement.500101.Description: "O time Impostor vence e nenhum jogador é exilado em reunião com o time Impostor válido naquele momento."
Achievement.500102.Name: "Aliados Intactos"
Achievement.500102.Description: "Quando o time Impostor vence, todos os Impostores válidos do início ainda estão vivos e não saíram do time."
Achievement.500103.Name: "Corrente de Assassinatos"
Achievement.500103.Description: "Na mesma partida, entre o fim de uma reunião e o início da próxima, habilidades de origem Impostor realmente causam a morte de ao menos 3 jogadores diferentes que não são Impostores, e no fim o time Impostor vence."
Achievement.500104.Name: "Especialista em Sabotagem"
Achievement.500104.Description: "A fonte de vitória base é o tempo esgotado de uma sabotagem capaz de encerrar a partida, e a vitória final não é sobreposta por Chacais nem convertida por outros papéis, e o time Impostor vence no fim."
Achievement.500105.Name: "Nenhum Rastro de Corpo"
Achievement.500105.Description: "Antes de o time Impostor vencer, suas habilidades realmente causam a morte de ao menos 3 jogadores diferentes que não são Impostores, e essas mortes não geram corpos reportáveis pelas regras da habilidade correspondente."
Achievement.500106.Name: "Morte por Mão Alheia"
Achievement.500106.Description: "O time Impostor vence e ao menos uma vez uma origem de manipulação clara, como o Controlador de Mentes ou o Marionetista, faz um executor que não é Impostor causar a morte de outro jogador que também não é Impostor."
Achievement.500107.Name: "Vigília Solitária"
Achievement.500107.Description: "Após todos os outros Impostores do início morrerem ou serem exilados, você se torna o único Impostor vivo, e depois disso faça você mesmo ao menos 2 abates válidos, sem nenhum novo Impostor entrar, e no fim o time Impostor vence."
Achievement.500108.Name: "Virada na Adversidade"
Achievement.500108.Description: "Após o resultado de uma reunião, restou apenas você como Impostor vivo, ao menos outro Impostor do início já foi exilado e há ao menos 4 Tripulantes válidos vivos, e depois disso você faz ao menos 3 abates válidos e no fim o time Impostor vence."
Achievement.500201.Name: "Ciclo de Tarefas"
Achievement.500201.Description: "A vitória por tarefa realmente é decidida, todas as tarefas válidas que contam para o progresso total dos Tripulantes da partida são concluídas, e no fim o time Tripulante vence."
Achievement.500202.Name: "Sem Erros de Julgamento"
Achievement.500202.Description: "O time Tripulante vence, ao menos uma reunião realmente exila um Impostor e nenhum Tripulante válido é exilado em reunião."
Achievement.500203.Name: "Reparo Eficiente"
Achievement.500203.Description: "Na mesma partida, você faz um reparo realmente eficaz em ao menos 3 instâncias de sabotagem diferentes e no fim vence com o time Tripulante, contando cada sabotagem no máximo uma vez."
Achievement.500204.Name: "Contra-Ataque Justo"
Achievement.500204.Description: "Na partida, ao menos um Impostor realmente morre por habilidades de origem Tripulante válida, como Xerife, Veterano e Guarda-Costa, e no fim o time Tripulante vence."
Achievement.500205.Name: "Reunião Decisiva"
Achievement.500205.Description: "Uma reunião exila um Impostor, a checagem de vitória após o processamento completo da fila de mortes dessa reunião realmente aciona vitória base dos Tripulantes, e no fim o time Tripulante vence."
Achievement.500206.Name: "Unidos Venceremos"
Achievement.500206.Description: "O time Tripulante vence e ao menos 3 profissões principais de Tripulante diferentes têm cada uma um evento de habilidade válido dentro da lista permitida."
Achievement.500207.Name: "Virada na Desvantagem"
Achievement.500207.Description: "Na contagem de times válida após o resultado de uma reunião, os Tripulantes têm ao menos 2 a menos que os Impostores, o anfitrião realmente adia pela regra especial claramente registrada o veredito de vitória que deveria encerrar a partida, e depois o time Tripulante vence."
Achievement.500208.Name: "Ninguém Fica para Trás"
Achievement.500208.Description: "Quando o time Tripulante vence, todos os Tripulantes válidos do início estão vivos, não desconectaram e não saíram do time Tripulante, e são ao menos 4 Tripulantes válidos no início, sem reduzir a contagem pela mudança de time."
Achievement.500301.Name: "Fim Independente"
Achievement.500301.Description: "Você realmente aciona uma fonte de vitória base exclusiva com uma profissão neutra e no fim vence."
Achievement.500302.Name: "Vencedor Versátil"
Achievement.500302.Description: "Em 3 partidas válidas diferentes, você aciona e vence com fontes de vitória base, de tomada ou adicionais exclusivas de 3 profissões principais neutras diferentes."
Achievement.500303.Name: "Sem Depender do Time"
Achievement.500303.Description: "Você aciona a vitória base exclusiva de uma profissão neutra e, após todas as regras adicionais e de vitória comum, a lista final de vencedores contém apenas você."
Achievement.500304.Name: "Vitória por Procuração"
Achievement.500304.Description: "Após sua morte, você realmente vence por regras de vitória adicionais ligadas a um alvo, como Seguidor e Advogado."
Achievement.500305.Name: "Fama Póstuma"
Achievement.500305.Description: "Sua morte ou exílio é o evento de disparo necessário da sua regra de vitória exclusiva, essa fonte de vitória realmente se concretiza e no fim você vence."
Achievement.500306.Name: "Uma Pessoa Muda o Fim"
Achievement.500306.Description: "Uma morte, mudança de contagem de times válida ou evento de exílio gerado pela sua habilidade neutra aciona a vitória base dessa profissão na próxima checagem de vitória após a fila completa de eventos, e no fim você vence."
Achievement.500307.Name: "O Convidado Vira Anfitrião"
Achievement.500307.Description: "Depois de gerar uma candidata à vitória base de Impostor ou Tripulante, sua regra neutra de tomada realmente muda a fonte da vitória para a sua própria profissão e no fim você vence."
Achievement.500308.Name: "Alvos Todos Eliminados"
Achievement.500308.Description: "Como Incendiário ou Médico da Peste, na mesma partida você conclui o encharcamento ou a infecção de ao menos 5 alvos válidos diferentes e completa todos os alvos restantes exigidos pela profissão, acionando a vitória exclusiva correspondente e vencendo no fim."
Achievement.500401.Name: "Efeito Adicional Disparado"
Achievement.500401.Description: "Seu emprego adicional realmente gera um evento válido da lista permitida 5.5."
Achievement.500402.Name: "Mudar o Fim Uma Vez"
Achievement.500402.Description: "Seu efeito adicional realmente impede uma morte, força a convocação de uma reunião de reporte, ou muda o resultado do exílio por votos ou efeito de desempate."
Achievement.500403.Name: "Identidade Dupla"
Achievement.500403.Description: "Na mesma partida, sua profissão principal e seu emprego adicional geram cada um ao menos um evento de habilidade válido."
Achievement.500404.Name: "Sinergia Dupla"
Achievement.500404.Description: "Na mesma partida, seus dois empregos adicionais diferentes geram cada um um evento válido da lista permitida e no fim você vence."
Achievement.500405.Name: "Corrente de Efeitos"
Achievement.500405.Description: "Sua corrente de Amantes realmente causa a morte dos dois Amantes, ou a corrente de morte de Vingador causa a sua morte e a de outro jogador."
Achievement.500406.Name: "Regras Ocultas"
Achievement.500406.Description: "Você vence no fim pela fonte de vitória exclusiva de Egoísta por tomada ou de Troll pelo primeiro abate, e já havia vencido em outra partida válida anterior por outro desses empregos adicionais."
