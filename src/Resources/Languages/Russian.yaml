ModeDescribe.HotPotato: "Текущий режим: [Горячая картошка]\nЛюбой игрок может стать горячей или холодной картошкой. Передайте горячую картошку холодной кнопкой убийства до конца отсчёта, иначе вы взорвётесь.\nХолодные картошки должны избегать горячих. Побеждает последний выживший."
ModeDescribe.DoomTag: "Текущий режим: [Смертельная охота]\nКаждому игроку назначается цель. Убив свою цель, вы получаете её цель. Атака неверной цели наказывается.\nПобеждает последний выживший."
HotPotatoInfo: "Передайте горячую картошку другому игроку!"
HotPotatoInfoLong: "Передайте горячую картошку холодной кнопкой убийства до конца отсчёта, иначе вы взорвётесь. Все видят, у кого горячая картошка."
ColdPotatoInfo: "Избегайте горячей картошки"
ColdPotatoInfoLong: "Избегайте горячей картошки и доживите до конца. Все видят, у кого горячая картошка."
TaggerInfo: "Убейте свою цель"
TaggerInfoLong: "Убейте назначенную вам цель, чтобы получить её цель. Атака неверной цели наказывается."

# 模式介绍 / Mode descriptions
ModeDescribe.SoloKombat: "Текущий режим — [Одиночный бой] Без распределения ролей. У всех есть ОЗ, и можно атаковать кнопкой убийства. Побеждает игрок с наибольшим числом убийств."

# 模式职业 / Mode Roles 
Drafter: "Выбирающий"
DrafterInfo: "Выберите свою роль на собрании"
DrafterInfoLong: "В режиме выбора ролей игроки по очереди выбирают свои роли на особом собрании."

# Reviewed proposal metadata; untranslated entries use Chinese fallback.
Achievement.100101.Name: "Точное попадание"
Achievement.100101.Description: "Лично убейте текущую цель розыска в отведённое время"
Achievement.100102.Name: "Серия розысков"
Achievement.100102.Description: "Совершите 3 убийства целей розыска за одну игру и победите командой Предателей"
Achievement.100201.Name: "Кровь ещё не остыла"
Achievement.100201.Description: "Совершите убийство до окончания таймера самоубийства"
Achievement.100202.Name: "Кровавая ночь"
Achievement.100202.Description: "Совершите 3 убийства за одну игру, победите командой Предателей и не погибните от таймера"
Achievement.100301.Name: "Запоздалая смерть"
Achievement.100301.Description: "Совершите успешный укус, и пусть он вызовет отложенную смерть цели"
Achievement.100302.Name: "Пир кровавой луны"
Achievement.100302.Description: "За одну игру вызовите минимум 2 отложенные смерти укусом и победите командой Предателей"
Achievement.100401.Name: "Проклятие сработало"
Achievement.100401.Description: "Успешно прокляните игрока, и пусть убийство Колдуна через проклятие умертвит другого игрока"
Achievement.100402.Name: "Чужими руками"
Achievement.100402.Description: "Пусть 2 убийства проклятием сработают за одну игру, и победите командой Предателей"
Achievement.100501.Name: "Метка и казнь"
Achievement.100501.Description: "Успешно пометьте цель и убейте её через телепортацию превращением"
Achievement.100502.Name: "Тихий приход"
Achievement.100502.Description: "За одну игру убейте телепортацией Ассасина 2 разных цели и доживите до победы команды Предателей"
Achievement.100601.Name: "Медлительное приближение"
Achievement.100601.Description: "После снижения скорости механизмом Зомби совершите убийство игрока"
Achievement.100602.Name: "Бессмертный финал"
Achievement.100602.Description: "Когда ваша скорость из-за Зомби упала минимум на 0.3 базовой, совершите убийство и победите командой Предателей"
Achievement.100701.Name: "Вынужденный доклад"
Achievement.100701.Description: "Успешно взломайте игрока и заставьте его сообщить о трупе, убитом Хакером в этом раунде"
Achievement.100702.Name: "Доклад без трупа"
Achievement.100702.Description: "Когда нет трупов для доклада, взломом вызовите особое собрание и победите командой Предателей"
Achievement.100801.Name: "Старый туннель, новый выход"
Achievement.100801.Description: "Превращением или его отменой телепортируйтесь к последней использованной вентиляции"
Achievement.100802.Name: "Сквозь туннели"
Achievement.100802.Description: "За одну игру сработайте телепортацию Шахтёра 3 раза и убейте в течение 10 секунд после одной из них"
Achievement.100901.Name: "Отход к точке"
Achievement.100901.Description: "Пометьте место, отойдите от метки на 8 единиц мировых координат и телепортируйтесь к ней"
Achievement.100902.Name: "Исчезнувший след"
Achievement.100902.Description: "После телепортации к метке убейте в течение 10 секунд и победите командой Предателей"
Achievement.101001.Name: "Только убийства"
Achievement.101001.Description: "Играя за Машину убийств, совершите результативное убийство"
Achievement.101002.Name: "Чистая жажда убийства"
Achievement.101002.Description: "Совершите 3 убийства за одну игру и победите командой Предателей"
Achievement.101101.Name: "После собрания"
Achievement.101101.Description: "Прокляните цель, и пусть она погибнет от проклятия после окончания собрания"
Achievement.101102.Name: "Незавершённый суд"
Achievement.101102.Description: "За одну игру оба проклятия должны убить после собрания, и победите командой Предателей"
Achievement.101201.Name: "Дела после смерти"
Achievement.101201.Description: "После смерти убейте игрока командой с указанием номера игрока"
Achievement.101202.Name: "Финал за кулисами"
Achievement.101202.Description: "После смерти убейте Члена Экипажа навыком Мафии, вызвав базовую победу Предателей при следующей проверке, и победите командой Предателей"
Achievement.101301.Name: "Пробный фейерверк"
Achievement.101301.Description: "Установите и взорвите минимум одну фейерверк-бомбу, и пусть она убьёт игрока"
Achievement.101302.Name: "Небо в огнях"
Achievement.101302.Description: "Одним взрывом убейте минимум 3 других игроков и победите командой Предателей"
Achievement.101401.Name: "Прямое попадание"
Achievement.101401.Description: "Убейте игрока лучом от начала до конца превращения"
Achievement.101402.Name: "Сквозь всю игру"
Achievement.101402.Description: "Совершите 2 убийства снайперским лучом за одну игру и победите командой Предателей"
Achievement.101501.Name: "Начало спектакля"
Achievement.101501.Description: "Успешно пометьте игрока, и пусть автоубийство Кукловода умертвит допустимую цель"
Achievement.101502.Name: "Невидимая рука"
Achievement.101502.Description: "За одну игру автоубийство Кукловода должно умертвить 2 разных цели, и победите командой Предателей"
Achievement.101601.Name: "Охота в темноте"
Achievement.101601.Description: "Совершите убийство во время отключения света"
Achievement.101602.Name: "Ускорение в темноте"
Achievement.101602.Description: "Совершите 2 убийства во время отключения света за одну игру и победите командой Предателей"
Achievement.101701.Name: "Поглощение времени"
Achievement.101701.Description: "Совершите убийство, и пусть ваш эффект эрозии времени сократит время следующего собрания"
Achievement.101702.Name: "Нет времени на споры"
Achievement.101702.Description: "За одну игру минимум 2 убийства должны дать эффект эрозии времени, сократив время хотя бы одного собрания, и победите командой Предателей"
Achievement.101801.Name: "Угаданная роль"
Achievement.101801.Description: "На собрании правильно угадайте роль игрока и убейте его"
Achievement.101802.Name: "Без промахов"
Achievement.101802.Description: "За одну игру сделайте 2 верных угадывания подряд, умертвив цель, без ошибок, и победите командой Предателей"
Achievement.101901.Name: "Кто-то у устройства"
Achievement.101901.Description: "Состояние приближения у наблюдаемого устройства должно смениться с лжи на истину и создать сигнал Анти Админера"
Achievement.101902.Name: "Ночной обход"
Achievement.101902.Description: "За одну игру получите минимум 3 сигнала приближения к минимум 2 типам устройств и победите командой Предателей"
Achievement.102001.Name: "Перезарядка короче"
Achievement.102001.Description: "После убийства сократите перезарядку убийства по механизму роли"
Achievement.102002.Name: "Всё быстрее"
Achievement.102002.Description: "За одну игру совершите 3 убийства; между минимум двумя не должно быть собраний, при последнем перезарядка уже сокращена ролью, и победите командой Предателей"
Achievement.102101.Name: "Взаимное уничтожение"
Achievement.102101.Description: "Взорвите себя и убейте минимум одного другого игрока"
Achievement.102102.Name: "Последний взрыв"
Achievement.102102.Description: "Одним самоподрывом убейте минимум 3 других игроков, и пусть команда Предателей победит по правилам"
Achievement.102201.Name: "Не трогай этот труп"
Achievement.102201.Description: "После убийства поставьте мину-ловушку, и пусть сообщивший о трупе игрок погибнет от неё"
Achievement.102202.Name: "Цепь ложных докладов"
Achievement.102202.Description: "Одна цепь мин-ловушек должна убить минимум 2 разных докладчиков, и победите командой Предателей"
Achievement.102301.Name: "Цель захвачена"
Achievement.102301.Description: "Превращением установите или смените цель слежки"
Achievement.102302.Name: "Сигнал убийства"
Achievement.102302.Description: "После сигнала от хоста об убийстве напарника убейте до следующего собрания и победите командой Предателей"
Achievement.102401.Name: "Трупа не осталось"
Achievement.102401.Description: "Убейте игрока так, чтобы Уборщик не оставил трупа для доклада"
Achievement.102402.Name: "Ни следа"
Achievement.102402.Description: "За одну игру совершите 3 убийства Уборщика без трупов и победите командой Предателей"
Achievement.102501.Name: "Смена лиц"
Achievement.102501.Description: "За одну игру превратитесь минимум в 2 разных игроков"
Achievement.102502.Name: "Тысяча лиц"
Achievement.102502.Description: "За одну игру превратитесь минимум в 4 разных игроков и убейте в течение 10 секунд после одного превращения"
Achievement.102601.Name: "Сверхурочные"
Achievement.102601.Description: "Успешно добавьте короткое задание игроку, подходящему по условиям навыка"
Achievement.102602.Name: "Долг по заданиям"
Achievement.102602.Description: "За одну игру добавьте минимум 3 коротких задания, пусть минимум одна цель выполнит ваше задание, и победите командой Предателей"
Achievement.102701.Name: "Набор удался"
Achievement.102701.Description: "Успешно обратите подходящего игрока в Безумца"
Achievement.102702.Name: "Рост организации"
Achievement.102702.Description: "За одну игру завербуйте 2 Безумцев, и пусть минимум один доживёт до победы команды Предателей"
Achievement.102801.Name: "Зачистка места"
Achievement.102801.Description: "Успешно уберите труп, чтобы о нём нельзя было сообщить"
Achievement.102802.Name: "Без свидетелей"
Achievement.102802.Description: "За одну игру уберите трупы 2 разных погибших и победите командой Предателей"
Achievement.102901.Name: "Квантование"
Achievement.102901.Description: "Успешно переведите цель в состояние квантового призрака"
Achievement.102902.Name: "Призраки тоже исчезают"
Achievement.102902.Description: "За одну игру 2 квантованные вами цели должны погибнуть от контакта с квантовым призраком, и победите командой Предателей"
Achievement.103001.Name: "Чётный цикл"
Achievement.103001.Description: "После сброса собранием совершите первое убийство, обновив перезарядку по правилу нечётного убийства"
Achievement.103002.Name: "Никогда с пустыми руками"
Achievement.103002.Description: "За одну игру совершите минимум 3 убийства, задействовав обновления перезарядки и для нечётных, и для чётных, и победите командой Предателей"
Achievement.103101.Name: "Контрудар проклятия"
Achievement.103101.Description: "При обычной попытке убийства потратьте заряд контрудара, предотвратите свою смерть и убейте убийцу"
Achievement.103102.Name: "Двойной отпор"
Achievement.103102.Description: "За одну игру сработайте контрудар проклятия 2 раза, убив разных убийц, и победите командой Предателей"
Achievement.103201.Name: "Обмен местами"
Achievement.103201.Description: "Превращением совершите результативный обмен местами"
Achievement.103202.Name: "Мгновенный обмен"
Achievement.103202.Description: "После обмена местами убейте в течение 5 секунд, сделайте это 2 раза за игру и победите командой Предателей"
Achievement.103302.Name: "Безостановочный огонь"
Achievement.103302.Description: "За один раунд совершите 3 убийства подряд, где последние два потратили пулю из запаса на сброс перезарядки"
Achievement.103401.Name: "Все в чёрном"
Achievement.103401.Description: "Активируйте навык сокрытия, и хост задаст единый вид подходящим игрокам"
Achievement.103402.Name: "Уйти в тень"
Achievement.103402.Description: "Во время действия навыка совершите убийство, не будьте изгнаны на следующем собрании и победите командой Предателей"
Achievement.103501.Name: "Стирание навыка"
Achievement.103501.Description: "После голосования на собрании сотрите рабочий навык подходящего Члена Экипажа"
Achievement.103502.Name: "Эра пустых"
Achievement.103502.Description: "За одну игру сотрите навыки 2 разных Членов Экипажа и победите командой Предателей"
Achievement.103601.Name: "Не один труп"
Achievement.103601.Description: "Одно убийство должно запустить расчленение, и создание нескольких трупов жертвы завершилось"
Achievement.103602.Name: "Гора останков"
Achievement.103602.Description: "За одну игру запустите расчленение с несколькими трупами для 3 разных жертв и победите командой Предателей"
Achievement.103701.Name: "Сквозь защиту"
Achievement.103701.Description: "Во время превращения задушите цель, имевшую обычную защиту до этой атаки"
Achievement.103702.Name: "Без следов"
Achievement.103702.Description: "За одну игру задушите 2 разных цели, минимум у одной пассивка смерти обходится удушением"
Achievement.103801.Name: "Невидимый вход"
Achievement.103801.Description: "Войдите через вентиляцию и успешно выйдите из невидимости"
Achievement.103802.Name: "Казнь из тени"
Achievement.103802.Description: "Совершите убийство до конца невидимости и победите командой Предателей"
Achievement.103901.Name: "Смертельное задание"
Achievement.103901.Description: "Выполните задание, и пусть навык задания Двуликого умертвит цель"
Achievement.103902.Name: "Смертельный список"
Achievement.103902.Description: "За одну игру навыком задания Двуликого убейте минимум 3 разных игроков и победите командой Предателей"
Achievement.104001.Name: "Ослепление"
Achievement.104001.Description: "Убейте игрока и ослепите минимум одного другого игрока, подходящего по комнате для навыка Скрытного"
Achievement.104002.Name: "Второй удар во тьме"
Achievement.104002.Description: "За одну игру минимум 2 убийства должны ослепить хотя бы одного игрока, и победите командой Предателей"
Achievement.104101.Name: "Информация до собрания"
Achievement.104101.Description: "В начале собрания хост отправляет вам минимум одно донесение о комнате с меткой трупа"
Achievement.104102.Name: "Повтор на месте"
Achievement.104102.Description: "После донесения о комнате с меткой трупа убейте в этой комнате между окончанием того собрания и началом следующего и победите командой Предателей"
Achievement.104201.Name: "В угол"
Achievement.104201.Description: "Успешно тащите цель и убейте её таймером перетаскивания или повторным нажатием"
Achievement.104202.Name: "Никто не найдёт"
Achievement.104202.Description: "Оттащите цель минимум на 5 единиц мировых координат от места начала и убейте навыком Пингвина; сделайте это для 2 разных целей за игру и победите командой Предателей"
Achievement.104301.Name: "Полный обзор"
Achievement.104301.Description: "В рамках настроек хост предоставляет вам данные о роли или навыке минимум одного игрока"
Achievement.104302.Name: "Предатель раскрыт"
Achievement.104302.Description: "Достигнув заданного числа убийств, впервые получите данные о настоящем Безумце и победите командой Предателей"
Achievement.104402.Name: "Эхо как клинок"
Achievement.104402.Description: "За одну игру сократите перезарядку двумя разными изгнаниями, после второго совершите убийство и победите командой Предателей"
Achievement.104501.Name: "Вспышка сработала"
Achievement.104501.Description: "Примените вспышку злого Гренадёра и ограничьте обзор минимум одному не-Предателю, подходящему по условиям"
Achievement.104502.Name: "Тьма лишь для врагов"
Achievement.104502.Description: "Одна вспышка должна задеть минимум 3 не-Предателей; убейте, пока действует ограничение обзора, и победите командой Предателей"
Achievement.200101.Name: "Правое угадывание"
Achievement.200101.Description: "На собрании верно угадайте роль допустимой злой цели и убейте её"
Achievement.200102.Name: "Двойное попадание"
Achievement.200102.Description: "За одну игру сделайте 2 верных угадывания подряд, умертвив цель, без ошибок, и победите командой Членов Экипажа"
Achievement.200201.Name: "Вырвался из лап смерти"
Achievement.200201.Description: "Играя за Удачника, при обычной попытке убийства сработайте вероятностный блок смерти"
Achievement.200202.Name: "Не судьба умереть"
Achievement.200202.Description: "За одну игру блокируйте 2 обычных убийства и победите со своей фактической командой"
Achievement.200301.Name: "Всего одно задание"
Achievement.200301.Description: "Выполните единственное задание, выданное Ленивому Парню в начале"
Achievement.200302.Name: "Лень до конца"
Achievement.200302.Description: "После стартового задания выживите минимум 2 собрания и победите командой Членов Экипажа"
Achievement.200401.Name: "На глазах у всех"
Achievement.200401.Description: "Третий живой игрок, кроме убийцы и Супер Звезды, должен быть ближе 2 единиц мировых координат к Звезде, чтобы предотвратить обычное убийство"
Achievement.200402.Name: "Нельзя одному"
Achievement.200402.Description: "За одну игру избегайте смерти от защиты расстоянием при 2 разных обычных попытках убийства и победите со своей фактической командой"
Achievement.200501.Name: "Срочные новости"
Achievement.200501.Description: "После смерти Знаменитости отправьте минимум одному подходящему игроку весть о её смерти"
Achievement.200502.Name: "Удар в заголовках"
Achievement.200502.Description: "На следующем после смерти Знаменитости собрании изгнайте её убийцу и победите командой Членов Экипажа"
Achievement.200601.Name: "Голос с силой"
Achievement.200601.Description: "При подсчёте голосов голос Мэра засчитывается как больше 1"
Achievement.200602.Name: "Решающий голос"
Achievement.200602.Description: "Ваши дополнительные голоса меняют ничью или исход изгнания, и изгнан Предатель"
Achievement.200701.Name: "Починка в один клик"
Achievement.200701.Description: "Одним действием починки вызовите быстрое восстановление Ремонтника, например починив саботаж одним нажатием или свет одним переключателем"
Achievement.200702.Name: "Король ремонта"
Achievement.200702.Description: "За одну игру устраните 3 разных саботажа, минимум один быстро починив Ремонтником, и победите командой Членов Экипажа"
Achievement.200801.Name: "Точный выстрел"
Achievement.200801.Description: "Навыком Шерифа убейте Предателя"
Achievement.200802.Name: "Без осечек"
Achievement.200802.Description: "За одну игру убейте навыком Шерифа 2 разных Предателей без ошибочных выстрелов"
Achievement.200901.Name: "Ложный доклад"
Achievement.200901.Description: "С помощью вентиляции вызовите ложный доклад о трупе и соберите собрание"
Achievement.200902.Name: "Виноват без трупа"
Achievement.200902.Description: "На собрании по вашему ложному докладу проголосуйте за Предателя, изгоните его и победите командой Членов Экипажа"
Achievement.201001.Name: "Тайна красных имён"
Achievement.201001.Description: "В списке красных имён, полученном от хоста на собрании, есть минимум один настоящий Предатель"
Achievement.201002.Name: "Правда и ложь"
Achievement.201002.Description: "На двух разных собраниях проголосуйте за настоящего Предателя из своего списка, и оба Предателя должны быть изгнаны"
Achievement.201101.Name: "Все задания"
Achievement.201101.Description: "Выполните все задания и откройте подсказку красного имени минимум одного Предателя"
Achievement.201102.Name: "Последнее доказательство"
Achievement.201102.Description: "Выполнив все задания, на следующем собрании проголосуйте за помеченного Предателя, изгоните его и победите со своей фактической командой"
Achievement.201201.Name: "Разгон от заданий"
Achievement.201201.Description: "После выполнения задания повысьте скорость механизмом Ускорителя"
Achievement.201202.Name: "Скоростное завершение"
Achievement.201202.Description: "За одну игру 3 раза запустите ускорение от заданий и доживите до победы команды Членов Экипажа"
Achievement.201301.Name: "Причина смерти"
Achievement.201301.Description: "Хост через способность Доктора создаёт и предоставляет вам сведения о причине смерти погибшего"
Achievement.201302.Name: "Два дела раскрыты"
Achievement.201302.Description: "За одну игру получите причины смерти 2 разных погибших, затем проголосуйте за Предателя, изгоните его и победите командой Членов Экипажа"
Achievement.201401.Name: "Один за одного"
Achievement.201401.Description: "Примените навык Диктатора и изгоните цель, затем Диктатор погибает по цене навыка"
Achievement.201402.Name: "Ценой жизни"
Achievement.201402.Description: "Навыком Диктатора изгоните Предателя, вызвав базовую победу Членов Экипажа при следующей проверке после полного разбора смертей, и победите командой Членов Экипажа"
Achievement.201501.Name: "Доклад с уликой"
Achievement.201501.Description: "После вашего доклада о трупе хост отправляет вам улику Детектива"
Achievement.201502.Name: "По следу убийцы"
Achievement.201502.Description: "За одну игру получите улики Детектива на двух разных собраниях-докладах, проголосуйте за настоящих убийц погибших, изгоните их и победите командой Членов Экипажа"
Achievement.201601.Name: "Один удар"
Achievement.201601.Description: "Праведным убийством Линчевателя убейте допустимую злую цель"
Achievement.201602.Name: "Решающий клинок"
Achievement.201602.Description: "Убейте Линчевателем Предателя, вызвав базовую победу Членов Экипажа при проверке после разбора смертей, и победите командой Членов Экипажа"
Achievement.201701.Name: "Путаница мест"
Achievement.201701.Description: "Выполните задание и запустите обмен местами двух разных игроков"
Achievement.201702.Name: "Цепь телепортов"
Achievement.201702.Description: "За одну игру запустите 3 результативных обмена местами и победите командой Членов Экипажа к концу игры"
Achievement.201801.Name: "Собрание дольше"
Achievement.201801.Description: "Выполните задание, и его эффект времени увеличит время следующего собрания"
Achievement.201802.Name: "Отвоёванное время"
Achievement.201802.Description: "Собрание должно стать длиннее минимум на 30 секунд из-за вашего задания; проголосуйте там за Предателя и изгоните его"
Achievement.201901.Name: "Контроль"
Achievement.201901.Description: "В режиме готовности убейте игрока, пытавшегося вас убить"
Achievement.201902.Name: "Кто тронет, тот умрёт"
Achievement.201902.Description: "За одну игру 2 раза проведите успешный контрудар в готовности, минимум один убитый из команды Предателей, и победите командой Членов Экипажа"
Achievement.202001.Name: "Принять удар"
Achievement.202001.Description: "Когда рядом убивают игрока, предотвратите убийство и погибните вместе с убийцей"
Achievement.202002.Name: "Последний рубеж"
Achievement.202002.Description: "Предотвратите убийство Члена Экипажа, убейте Предателя-убийцу и победите командой Членов Экипажа"
Achievement.202101.Name: "Подделка продана"
Achievement.202101.Description: "Успешно передайте подделку игроку"
Achievement.202102.Name: "Осечка подделки"
Achievement.202102.Description: "Выданная вами подделка заставляет владельца погибнуть при попытке убийства, и победите командой Членов Экипажа"
Achievement.202201.Name: "Ослепить Предателя"
Achievement.202201.Description: "С помощью вентиляции примените вспышку и ограничьте обзор минимум одному Предателю"
Achievement.202202.Name: "Победа вслепую"
Achievement.202202.Description: "Одна вспышка должна задеть минимум 2 Предателей; до начала собрания, пока ограничение обзора действует, убейте одного из них навыком Члена Экипажа"
Achievement.202302.Name: "Спаситель"
Achievement.202302.Description: "За одну игру выданный вами щит блокирует 2 обычных убийства, и победите командой Членов Экипажа"
Achievement.202401.Name: "Гадание удалось"
Achievement.202401.Description: "На собрании проведите гадание, и хост предоставит вам данные о цели"
Achievement.202402.Name: "Раскрытая правда"
Achievement.202402.Description: "Выполнив все задания, получите гаданием данные о настоящем Предателе; проголосуйте за него на собрании, изгоните и победите командой Членов Экипажа"
Achievement.202501.Name: "Вне живых"
Achievement.202501.Description: "Играя за Ошибку, завершите игру, не умерев физически; определяется через `PlayerState.IsDead` и `Data.IsDead`"
Achievement.202502.Name: "По ту сторону жизни и смерти"
Achievement.202502.Description: "В одном снимке проверки правила Ошибки и сравнение только как обычного живого Члена Экипажа дают разные базовые итоги; к финалу вы физически живы и побеждаете"
Achievement.202601.Name: "Верный приговор"
Achievement.202601.Description: "Командой приговора убейте цель, подходящую под злое условие навыка"
Achievement.202602.Name: "Удар молотка"
Achievement.202602.Description: "За одну игру 2 успешных приговора подряд без ошибочных и победите командой Членов Экипажа"
Achievement.202701.Name: "Последний контакт"
Achievement.202701.Description: "После вашего доклада о трупе хост отправляет данные о последнем, с кем контактировал погибший"
Achievement.202702.Name: "Свидетельство мёртвых"
Achievement.202702.Description: "Полученный вами последний контакт это настоящий убийца погибшего; проголосуйте за него на этом или следующем собрании, изгоните и победите со своей фактической командой"
Achievement.202801.Name: "Ответ умершего"
Achievement.202801.Description: "После доклада о трупе установите связь, и хост отправит вам действительный ответ да или нет от погибшего"
Achievement.202802.Name: "Последний вопрос"
Achievement.202802.Description: "На собрании получите ответ погибшего, проголосуйте за настоящего убийцу и изгоните его, победив командой Членов Экипажа"
Achievement.202901.Name: "Разбитый щит"
Achievement.202901.Description: "Хост через способность Аудитора отправляет вам сигнал о разбитии щита другого игрока"
Achievement.202902.Name: "Правда за щитом"
Achievement.202902.Description: "За одну игру получите через Аудитора 3 сигнала о разбитии щита от разных атак; затем проголосуйте за злую цель, изгоните её и победите со своей фактической командой"
Achievement.203001.Name: "Время гимна"
Achievement.203001.Description: "С помощью вентиляции примените сброс и сбросьте перезарядку минимум одному подходящему игроку"
Achievement.203002.Name: "После мира"
Achievement.203002.Description: "Один сброс должен снять перезарядку минимум 2 разным игрокам с кнопкой убийства, и вы доживите до победы команды Членов Экипажа"
Achievement.203101.Name: "Сбор образцов"
Achievement.203101.Description: "За один раунд соберите образцы 2 разных игроков"
Achievement.203102.Name: "Образец указывает на убийцу"
Achievement.203102.Description: "После отправки ваших данных об образце проголосуйте на этом или следующем собрании за соответствующего Предателя, изгоните его и победите командой Членов Экипажа"
Achievement.203201.Name: "Обмен голосами"
Achievement.203201.Description: "На собрании проведите обмен голосами между двумя разными игроками"
Achievement.203202.Name: "Перелом голосования"
Achievement.203202.Description: "Ваш обмен голосами меняет изгнанного и изгоняет Предателя, и победите командой Членов Экипажа"
Achievement.203301.Name: "Особое собрание"
Achievement.203301.Description: "Соберите особое собрание, где можно голосовать только за двух заданных игроков"
Achievement.203302.Name: "Оба виновны"
Achievement.203302.Description: "На созванном вами особом собрании по правилам навыка одновременно изгнаны две разные злые цели, и победите командой Членов Экипажа"
Achievement.203402.Name: "Некуда бежать"
Achievement.203402.Description: "За одну игру заблокируйте минимум 3 разные вентиляции, и хост должен явно пресечь минимум одну попытку врага войти; победите командой Членов Экипажа"
Achievement.300102.Name: "Всё в огне"
Achievement.300102.Description: "Обливайте всех живых, подходящих для поджога, подожгите их, вызовите свою победу Поджигателя и победите"
Achievement.300201.Name: "Голосуйте за меня"
Achievement.300201.Description: "Будьте изгнаны голосованием на собрании, вызовите свою победу Шута и победите"
Achievement.300202.Name: "Занавес в начале"
Achievement.300202.Description: "Будьте изгнаны на первом собрании игры, вызовите свою победу Шута и победите"
Achievement.300301.Name: "В поезде победы"
Achievement.300301.Description: "Доживите до финала и войдите в список победителей по правилу Выжившего"
Achievement.300302.Name: "Выжить в щели"
Achievement.300302.Description: "Играя за Выжившего, переживите минимум 3 собрания, где минимум на 2 изгнали другого игрока, и победите по своему правилу Выжившего"
Achievement.300401.Name: "Уход после заданий"
Achievement.300401.Description: "Погибните после выполнения всех заданий, вызовите свою победу Террориста и победите"
Achievement.300402.Name: "Опасное изгнание"
Achievement.300402.Description: "После выполнения всех заданий будьте изгнаны собранием, вызвав свою победу Террориста, и победите"
Achievement.300501.Name: "Цель выбыла"
Achievement.300501.Description: "Заданная цель казни изгнана собранием, и победите по своему правилу Палача"
Achievement.300502.Name: "Приговор на втором собрании"
Achievement.300502.Description: "Цель казни изгнана до конца второго собрания игры; проголосуйте за неё и победите по своему правилу Палача"
Achievement.300601.Name: "Перевес в числах"
Achievement.300601.Description: "Вызовите базовую победу на основе численного преимущества или баланса Шакалов и победите командой Шакалов"
Achievement.300602.Name: "Стая растёт"
Achievement.300602.Description: "Завербуйте Напарника; ни вы, ни он не покидайте команду Шакалов и доживите до её победы"
Achievement.300701.Name: "Верный помощник"
Achievement.300701.Description: "Играя за Напарника, доживите до победы Шакалов и войдите в список победителей"
Achievement.300702.Name: "Преемник"
Achievement.300702.Description: "После смерти Шакала станьте Шакалом по включённому правилу наследования и добейтесь победы Шакалов"
Achievement.300801.Name: "Знающий всё"
Achievement.300801.Description: "Играя за Дьявола, переживите собрание, и хост предоставит вам данные о ролях других игроков"
Achievement.300802.Name: "Последний победитель"
Achievement.300802.Description: "Играя за Дьявола, переживите минимум 3 собрания; ваше правило кражи победы перекрывает базовую, и вы побеждаете"
Achievement.300901.Name: "Прыжки в вентиляцию"
Achievement.300901.Description: "За одну игру число ваших прыжков в вентиляцию достигает половины порога победы хоста с округлением вверх"
Achievement.300902.Name: "Чемпион труб"
Achievement.300902.Description: "Ваши прыжки в вентиляцию достигают порога победы хоста, вызывая вашу победу Марио, и вы побеждаете"
Achievement.301001.Name: "Подстава удалась"
Achievement.301001.Description: "Навык Обвинителя фиксирует допустимую цель подставы, и вы погибнете из-за этой подставы"
Achievement.301002.Name: "Немедленный приговор"
Achievement.301002.Description: "На следующем после вашей подставы собрании изгоните соответствующую цель и победите по своему правилу Обвинителя"
Achievement.301101.Name: "Проглотить одного"
Achievement.301101.Description: "Успешно съешьте игрока живьём"
Achievement.301102.Name: "Сытый финал"
Achievement.301102.Description: "За одну игру живьём съешьте минимум 3 разных игроков и добейтесь победы команды Пеликанов"
Achievement.301201.Name: "Покорение удалось"
Achievement.301201.Description: "Успешно зафиксируйте покорение игрока"
Achievement.301202.Name: "Революция удалась"
Achievement.301202.Description: "До конца таймера наберите заданное число покорённых и прыгните в вентиляцию, вызвав свою победу Революционера"
Achievement.301301.Name: "Только влюблённые"
Achievement.301301.Description: "Навыком Бессердечника убейте допустимого Любовника или Нептуна по текущему коду"
Achievement.301302.Name: "Победа холостяка"
Achievement.301302.Description: "Убейте минимум одну допустимую цель Бессердечника и победите по своему правилу Бессердечника к финалу"
Achievement.301401.Name: "Ноль здоровья"
Achievement.301401.Description: "Механизмом здоровья Демона сведите здоровье цели к нулю и убейте её"
Achievement.301402.Name: "Лоб в лоб"
Achievement.301402.Description: "За одну игру совершите минимум 3 убийства механизмом здоровья и добейтесь победы команды Демонов"
Achievement.301501.Name: "Убийство и отключение"
Achievement.301501.Description: "Убейте игрока, и пусть навык Сталкера превратит саботаж электричества из неактивного в активный"
Achievement.301502.Name: "Власть во тьме"
Achievement.301502.Description: "За одну игру убийствами запустите минимум 3 разных саботажа электричества и победите по правилу кражи победы Сталкера"
Achievement.301601.Name: "Больше заданий"
Achievement.301601.Description: "Выполните половину всех заданий, выданных вам как Трудоголику, с округлением вверх"
Achievement.301602.Name: "Без конца работы"
Achievement.301602.Description: "Выполните все текущие обязательные задания Трудоголика, вызовите свою победу Трудоголика и победите"
Achievement.301701.Name: "Сбор голосов"
Achievement.301701.Description: "Проголосуйте за игрока и увеличьте счётчик собранных голосов"
Achievement.301702.Name: "Полный набор голосов"
Achievement.301702.Description: "До подсчёта изгнания наберите порог победы по голосам и победите по своему правилу Коллектора"
Achievement.301801.Name: "Одна судьба"
Achievement.301801.Description: "Навыком Провокатора погибните вместе с целью"
Achievement.301802.Name: "Вместе, но порознь"
Achievement.301802.Description: "Ваша цель самоподрыва не в списке победителей, а вы побеждаете по правилу Провокатора"
Achievement.301901.Name: "Щит после убийства"
Achievement.301901.Description: "После убийства получите щит Кровного Рыцаря"
Achievement.301902.Name: "Серия щитов"
Achievement.301902.Description: "За одну игру щит Кровного Рыцаря блокирует 2 разных обычных убийства; добейтесь победы команды Кровного Рыцаря"
Achievement.302002.Name: "Бонус после смерти"
Achievement.302002.Description: "После вашей смерти цель ставки побеждает, и вы побеждаете по правилу Последователя"
Achievement.302101.Name: "Очарование удалось"
Achievement.302101.Description: "Очаруйте подходящего не-Нейтрала, и он перейдёт в команду Суккуба"
Achievement.302102.Name: "Очарованное большинство"
Achievement.302102.Description: "Очаруйте минимум 2 разных игроков, вызовите базовую победу по числу команды Суккуба и победите"
Achievement.302201.Name: "Выбор стороны"
Achievement.302201.Description: "Играя за Кота, получите атаку; механизм Кота предотвратит смерть и сменит вашу роль"
Achievement.302202.Name: "Другая сторона Кота"
Achievement.302202.Description: "После смены роли от удара по Коту войдите в список победителей с новой ролью или командой"
Achievement.302301.Name: "Распространение"
Achievement.302301.Description: "Доведите допустимую цель до состояния завершённого заражения Чумного доктора"
Achievement.302302.Name: "Конец чумы"
Achievement.302302.Description: "Заразите всех подходящих живых игроков и победите по своему правилу Чумного доктора"
Achievement.302401.Name: "Обмен ролями"
Achievement.302401.Description: "Играя за Сменщика, выберите цель и завершите обмен ролями после следующего собрания"
Achievement.302402.Name: "Тасование судьбы"
Achievement.302402.Description: "Обменяйтесь как Сменщик, верните себе роль Сменщика другим Сменщиком, совершите второй обмен, получив две разные основные роли, и доживите до финала"
Achievement.302501.Name: "Верное предсказание"
Achievement.302501.Description: "Удачным угадыванием получите верную запись Вестника рока"
Achievement.302502.Name: "Непобедимый в предсказаниях"
Achievement.302502.Description: "По настройкам хоста наберите нужные верные угадывания без ошибок и победите по своему правилу Вестника рока"
Achievement.302601.Name: "Появился соперник"
Achievement.302601.Description: "Игрок, пробывший рядом с объектом влюблённости нужное время, отмечается как ваш соперник"
Achievement.302602.Name: "Только мы двое"
Achievement.302602.Description: "Достигните числа игроков и состояния объекта влюблённости, заданных кодом Яндере; вызовите свою победу Яндере и победите"
Achievement.302701.Name: "Солнечный уход"
Achievement.302701.Description: "После вашей смерти войдите в список победителей по правилу Солнечного парня"
Achievement.302702.Name: "Занавес не опущен"
Achievement.302702.Description: "Погибните до первого собрания, переживите ещё минимум 2 собрания и победите по своему правилу Солнечного парня"
Achievement.302801.Name: "Посмертное представительство"
Achievement.302801.Description: "С допустимым клиентом погибните Адвокатом без смены роли; если клиент стал победителем до проверки вашего правила, вы побеждаете по правилу Адвоката, и оба в списке победителей"
Achievement.302802.Name: "Приоритет представителя"
Achievement.302802.Description: "Доживите Адвокатом до победы с клиентом, ставшим победителем до проверки вашего правила; ваше правило лишает его статуса и добавляет вас, вы побеждаете, а клиента нет в списке"
Achievement.302901.Name: "Холостой сработал"
Achievement.302901.Description: "Выданный вами холостой патрон обнуляет следующее не-суицидальное убийство игрока"
Achievement.302902.Name: "Двойной отказ"
Achievement.302902.Description: "За одну игру ваши холостые патроны срывают по одному не-суицидальному убийству двух разных игроков; выживите Прокурором и победите по своему правилу"
Achievement.600101.Name: "Вместе до конца"
Achievement.600101.Description: "Оба Любовника доживают до финала и побеждают вместе"
Achievement.600102.Name: "Общая судьба"
Achievement.600102.Description: "После смерти одного Любовника второй погибает от горя по включённому правилу комнаты"
Achievement.600201.Name: "Последний Предатель"
Achievement.600201.Description: "Станьте последним живым в команде Предателей и получите усиление перезарядки последнего Предателя"
Achievement.600202.Name: "Ответ из безвыходности"
Achievement.600202.Description: "Совершите убийство во время действия усиления безвыходности и победите командой Предателей"
Achievement.600301.Name: "Любовник для всех"
Achievement.600301.Description: "Хост по правилу показа Нептуна даёт минимум 3 разным игрокам отметку связи с вами"
Achievement.600302.Name: "Среди всех цветов"
Achievement.600302.Description: "Играя с Атрибутом Нептуна, переживите минимум 2 собрания и победите со своей командой"
Achievement.600401.Name: "Видеть каждый голос"
Achievement.600401.Description: "На собрании хост применяет к вам правило показа неанонимных голосов Наблюдателя"
Achievement.600402.Name: "Секрет большинства"
Achievement.600402.Description: "Получив неанонимный результат голосования, на следующем собрании проголосуйте за Предателя, изгоните его и победите со своей командой"
Achievement.600501.Name: "Свет не гаснет"
Achievement.600501.Description: "Выполните задание, пока действует саботаж электричества и включено правило обзора Фонарика"
Achievement.600502.Name: "Осветить победу"
Achievement.600502.Description: "За одну игру выполните минимум 3 задания при саботаже электричества и правиле обзора Фонарика и доживите до победы Членов Экипажа"
Achievement.600601.Name: "Вспышка смерти"
Achievement.600601.Description: "При смерти другого игрока хост через способность Провидца отправляет вам сигнал убийства"
Achievement.600602.Name: "Вспышка указывает убийцу"
Achievement.600602.Description: "Получив сигнал убийства от Провидца, на следующем собрании проголосуйте за настоящего убийцу и изгоните его, победив со своей командой"
Achievement.600701.Name: "На шаг впереди"
Achievement.600701.Description: "Выполните задание во время действия ускорения Флэша"
Achievement.600702.Name: "Быстрый как молния"
Achievement.600702.Description: "За одну игру выполните 5 заданий во время ускорения Флэша и доживите до победы своей команды"
Achievement.600801.Name: "Слом ничьей"
Achievement.600801.Description: "При ничьей ваш эффект решающего голоса приводит к изгнанию вашей цели"
Achievement.600802.Name: "Последний голос"
Achievement.600802.Description: "Ваш решающий голос изгоняет Предателя, и победите со своей командой"
Achievement.600901.Name: "Нельзя доложить"
Achievement.600901.Description: "При действии ограничения Забывчивого подойдите к трупу на дистанцию действительного доклада"
Achievement.600902.Name: "Молчаливый свидетель"
Achievement.600902.Description: "При действии ограничения Забывчивого за одну игру подойдите к трупам 3 разных погибших на дистанцию доклада и доживите до победы своей команды"
Achievement.601001.Name: "Заражение обзором"
Achievement.601001.Description: "После вашей смерти эффект Растерянного ограничивает обзор убийце"
Achievement.601002.Name: "Ответ перед смертью"
Achievement.601002.Description: "После вашего заражения обзором убийцу изгоняют на следующем собрании, и ваша команда побеждает"
Achievement.601101.Name: "Тайная помощь"
Achievement.601101.Description: "Играя за Безумца, на собрании проголосуйте за настоящего Члена Экипажа, изгоните его и победите с командой Предателей"
Achievement.601102.Name: "Переворот первым ударом"
Achievement.601102.Description: "В режиме предательства по первому убийству или по самоголосу станьте Безумцем и победите с командой Предателей"
Achievement.601201.Name: "Не починить"
Achievement.601201.Description: "При действии ограничения Глупца выполните задание во время саботажа, который вы не можете исправить"
Achievement.601202.Name: "Каждый при своём"
Achievement.601202.Description: "За одну игру выполните по заданию во время 2 разных саботажей, которые вы не можете исправить как Глупец; их чинят другие, и вы побеждаете со своей командой"
Achievement.601301.Name: "Первым сдал"
Achievement.601301.Description: "По правилу выдачи Работника получите этот Атрибут, первым выполнив нужное задание"
Achievement.601302.Name: "И дополнительную работу закончил"
Achievement.601302.Description: "Выполните все задания, дополнительно выданные событием Работника, и доживите до победы своей команды"
Achievement.601401.Name: "Забрать с собой"
Achievement.601401.Description: "После обычного убийства ваш эффект Мстителя убивает другого игрока"
Achievement.601402.Name: "Враг падает вместе"
Achievement.601402.Description: "Ваша месть убивает врага из враждебной команды, и ваша команда побеждает"
Achievement.601501.Name: "Главная жертва"
Achievement.601501.Description: "Станьте первым обычной убитой жертвой игры, вызовите свою победу Ютубера и победите"
Achievement.601502.Name: "Не по сценарию"
Achievement.601502.Description: "Не запустив победу первого убийства Ютубера, завершите игру с Атрибутом Ютубера физически живым и победите со своей командой"
Achievement.601601.Name: "Единоличная победа"
Achievement.601601.Description: "Ваше правило Эгоиста перекрывает базовую победу исходной команды, и вы побеждаете"
Achievement.601602.Name: "Финальный монополист"
Achievement.601602.Description: "При краже Эгоиста до перекрытия в наборе победителей минимум 3 других игрока, а в финале только вы"
Achievement.601701.Name: "Голоса с убийств"
Achievement.601701.Description: "После убийства увеличьте свои дополнительные голоса механизмом Вора"
Achievement.601702.Name: "Тайные голоса решают"
Achievement.601702.Description: "Ваши дополнительные голоса Вора меняют исход и изгоняют врага из враждебной команды"
Achievement.601801.Name: "Двойной счёт"
Achievement.601801.Description: "При проверке победы ваш дополнительный игрок Шизофреника учитывается"
Achievement.601802.Name: "Лишний игрок"
Achievement.601802.Description: "При неизменных правилах удаление вашего дополнительного игрока дало бы базовую победу врагов, но проверка этого не вызвала; затем ваша команда побеждает"
Achievement.601901.Name: "Оставленные данные"
Achievement.601901.Description: "После смерти Мимика хост отправляет минимум одному подходящему Предателю данные о роли убитой вами цели"
Achievement.601902.Name: "Список смертей"
Achievement.601902.Description: "До вашей смерти убейте 2 разных игроков, и данные Мимика о них получает минимум один союзник; победите командой Предателей"
Achievement.602001.Name: "Убийство на дистанции"
Achievement.602001.Description: "При действии бонуса дальности Длиннолапа убейте на расстоянии, превышающем обычное без бонуса"
Achievement.602002.Name: "Дальний выстрел"
Achievement.602002.Description: "За одну игру совершите 2 таких дальних убийства и победите со своей командой"
Achievement.602101.Name: "Приманка сработала"
Achievement.602101.Description: "После вашего убийства эффект Байта заставляет убийцу сообщить о вашем трупе и созвать собрание"
Achievement.602102.Name: "Вызвать убийцу"
Achievement.602102.Description: "На собрании от вашей приманки изгнание убийцы срабатывает, и ваша команда побеждает"
Achievement.602201.Name: "Поймать убийцу"
Achievement.602201.Description: "После вашего убийства эффект Капкана ограничивает передвижение убийцы"
Achievement.602202.Name: "Контрудар капкана"
Achievement.602202.Description: "После срабатывания вашего капкана убийцу изгоняют на следующем собрании, и ваша команда побеждает"
Achievement.602301.Name: "Искажение цвета"
Achievement.602301.Description: "С самого старта и до финала держите Атрибут Дальтоника и завершите игру физически живым"
Achievement.602302.Name: "Враги без цвета"
Achievement.602302.Description: "При действии правила Дальтоника на собрании проголосуйте за настоящего Предателя, изгоните его и победите со своей командой"
Achievement.500101.Name: "Никто не раскрыт"
Achievement.500101.Description: "Победите командой Предателей, и пусть никого не изгонят собранием в роли Предателя"
Achievement.500102.Name: "Все свои целы"
Achievement.500102.Description: "К победе Предателей все стартовые Предатели живы и не покинули команду"
Achievement.500103.Name: "Цепь убийств"
Achievement.500103.Description: "За одну игру между окончанием и началом собраний навыки Предателей убивают минимум 3 разных не-Предателей, и победите командой Предателей"
Achievement.500104.Name: "Мастер саботажа"
Achievement.500104.Description: "Базовой победой должен стать завершающий саботаж по таймеру, не перекрытый Шакалами или другими ролями, и победите командой Предателей"
Achievement.500105.Name: "Ни трупа, ни следа"
Achievement.500105.Description: "До победы Предателей их навыки убивают минимум 3 разных не-Предателей без создания трупов для доклада"
Achievement.500106.Name: "Руками врага"
Achievement.500106.Description: "Победите командой Предателей, и пусть Колдун или Кукловод заставят не-Предателя убить другого не-Предателя"
Achievement.500107.Name: "Ночной дозор"
Achievement.500107.Description: "Когда остальные стартовые Предатели мертвы или изгнаны, останьтесь единственным живым Предателем: совершите минимум 2 убийства без новых союзников и победите командой Предателей"
Achievement.500108.Name: "Ловля против ветра"
Achievement.500108.Description: "После собрания вы единственный живой Предатель, минимум один стартовый Предатель изгнан и минимум 4 живых Члена Экипажа: совершите минимум 3 убийства и победите командой Предателей"
Achievement.500201.Name: "Задания замкнуты"
Achievement.500201.Description: "Победа по заданиям должна сработать: выполнены все задания, идущие в общий прогресс Членов Экипажа, и победите командой Членов Экипажа"
Achievement.500202.Name: "Без ошибок"
Achievement.500202.Description: "Победите командой Членов Экипажа: минимум на одном собрании изгнан Предатель, и ни один Член Экипажа не был изгнан"
Achievement.500203.Name: "Мастер ремонта"
Achievement.500203.Description: "За одну игру починьте минимум 3 разных саботажа и победите командой Членов Экипажа"
Achievement.500204.Name: "Праведный отпор"
Achievement.500204.Description: "За игру минимум один Предатель погибает от навыков Шерифа, Ветерана, Телохранителя и подобных, и победите командой Членов Экипажа"
Achievement.500205.Name: "Ключевое собрание"
Achievement.500205.Description: "Собрание изгоняет Предателя, после полного разбора смертей проверка вызывает базовую победу Членов Экипажа, и победите командой Членов Экипажа"
Achievement.500206.Name: "Единый фронт"
Achievement.500206.Description: "Победите командой Членов Экипажа: минимум 3 разных основные роли Членов Экипажа дают по одному допустимому событию навыка"
Achievement.500207.Name: "Перелом в беде"
Achievement.500207.Description: "После собрания Членов Экипажа минимум на 2 меньше Предателей; хост откладывает проверку по особому правилу, и затем Члены Экипажа побеждают"
Achievement.500208.Name: "Никто не отстал"
Achievement.500208.Description: "К победе Членов Экипажа все стартовые Члены Экипажа (минимум 4) живы, не отключились и не покинули команду"
Achievement.500301.Name: "Независимый финал"
Achievement.500301.Description: "Играя за Нейтрала, вызовите свою базовую победу и победите"
Achievement.500302.Name: "Многоликий победитель"
Achievement.500302.Description: "В 3 разных играх одержите победу, запустив свою базовую, кражу или дополнительную победу тремя разными основными Нейтралами"
Achievement.500303.Name: "Сам по себе"
Achievement.500303.Description: "Вызовите базовую победу Нейтрала; после всех правил дополнительных и общих побед в списке победителей только вы"
Achievement.500304.Name: "Победа через союзника"
Achievement.500304.Description: "После смерти победите по правилу Последователя, Адвоката или иной привязки к цели"
Achievement.500305.Name: "Слава после смерти"
Achievement.500305.Description: "Ваша смерть или изгнание обязательное условие вашего правила победы; победа срабатывает, и вы побеждаете"
Achievement.500306.Name: "Один меняет исход"
Achievement.500306.Description: "Смерть, смена счёта команд или изгнание от вашего нейтрального навыка вызывают базовую победу роли при следующей проверке, и вы побеждаете"
Achievement.500307.Name: "Перехват инициативы"
Achievement.500307.Description: "После появления базы победы Предателей или Экипажа ваше нейтральное правило кражи меняет источник победы на вашу роль, и вы побеждаете"
Achievement.500308.Name: "Все цели"
Achievement.500308.Description: "Будучи Поджигателем или Чумным доктором, за игру облейте или заразите минимум 5 разных целей, выполните все остальные цели роли и победите"
Achievement.500401.Name: "Атрибут сработал"
Achievement.500401.Description: "Ваш Атрибут создаёт одно допустимое событие из белого списка 5.5"
Achievement.500402.Name: "Исход изменён"
Achievement.500402.Description: "Ваш Атрибут предотвращает смерть, заставляет созвать собрание-доклад или меняет изгнание через голоса или ничью"
Achievement.500403.Name: "Двойная роль"
Achievement.500403.Description: "За одну игру ваша основная роль и Атрибут дают минимум по одному допустимому событию навыка"
Achievement.500404.Name: "Двойная синергия"
Achievement.500404.Description: "За одну игру два разных ваших Атрибута дают по допустимому событию, и вы побеждаете"
Achievement.500405.Name: "Цепь эффектов"
Achievement.500405.Description: "Ваша цепь Любовников убивает обоих, или цепь смерти Мстителя убивает вас и другого игрока"
Achievement.500406.Name: "Скрытое правило"
Achievement.500406.Description: "Победите по правилу кражи Эгоиста или первого убийства Ютубера, уже одержав ранее в другой игре победу другим таким Атрибутом"
