# 模式介绍 / Mode descriptions
ModeDescribe.SoloKombat: "本房间模式为【个人竞技模式】\n没有职业分配，所有人拥有血量，可以使用击杀键对其他人造成伤害。游戏结束时击杀数量最多的玩家获胜。"
ModeDescribe.HotPotato: "本房间模式为【烫手山芋模式】\n所有玩家都有可能是冷/热土豆，热土豆必须通过击杀把热土豆传给其他冷土豆，否则倒计时结束时自己就会被炸死。\n冷土豆需要躲避热土豆并努力存活，最后存活的人获胜。"
ModeDescribe.DoomTag: "本房间模式为【末日猎杀模式】\n每名玩家都会被分配一个猎物，击杀自己的猎物后可以继承它的猎物，击杀错误的目标会受到惩罚。\n最后存活的人获胜。"

